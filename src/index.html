<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Læsehjælper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "OpenDyslexic"; font-weight: 400; src: url(data:font/woff2;base64,%%OD_400%%) format("woff2"); }
@font-face { font-family: "OpenDyslexic"; font-weight: 700; src: url(data:font/woff2;base64,%%OD_700%%) format("woff2"); }

:root {
  /* Farben */
  --sky: #eef1ff;        /* App-Hintergrund, kühles Papier */
  --ink: #17193b;        /* Text, tiefes Marineblau */
  --muted: #5d6185;
  --line: #d9ddf5;
  --surface: #ffffff;
  --blue: #2f3fe0;       /* Hauptfarbe = erste Silbe */
  --red: #e5412d;        /* zweite Silbe */
  --sun: #ffc83d;        /* Hervorhebung, Hauptknopf */
  --sun-ink: #3b2a00;
  /* Silben im Lesetext (einstellbar) */
  --s0: var(--blue);
  --s1: var(--red);
  --page-bg: #ffffff;
  --font: "Andika", sans-serif;
  --size: 32px;
  --ls: 0.04em;
  --ws: 0.25em;
  --lh: 1.9;
  --ui: "Bricolage Grotesque", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--ui);
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--sky);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 18px 120px; }

/* Kopfzeile */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 8px; }
.brand { display: flex; align-items: center; gap: 9px; cursor: pointer; border-radius: 10px; }
.brand .name { font-size: 19px; font-weight: 750; letter-spacing: -0.01em; }
.logo { width: 30px; height: 30px; }
.pill { display: inline-flex; background: #fff; border-radius: 999px; padding: 3px; box-shadow: inset 0 0 0 1.5px var(--line); }
.pill button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 650; font-size: 15px; color: var(--muted); }
.pill button.on { background: var(--ink); color: #fff; }

/* Startseite */
.hero { padding: 34px 0 8px; }
.hero h1 {
  font-size: clamp(54px, 15vw, 104px); line-height: 1; letter-spacing: -0.035em; font-weight: 800;
  margin: 0 0 22px; font-variation-settings: "opsz" 96;
}
.hero h1 { padding-bottom: .22em; }
.hero h1 .s { position: relative; display: inline-block; }
.hero h1 .s0 { color: var(--blue); } .hero h1 .s1 { color: var(--red); }
.hero h1 .s::after {
  content: ""; position: absolute; left: 10%; right: 10%; bottom: -.26em; height: .18em;
  border: .055em solid currentColor; border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%;
  transform-origin: center; animation: arc .5s cubic-bezier(.3,1.4,.6,1) both;
}
.hero h1 .s:nth-child(2)::after { animation-delay: .12s; }
.hero h1 .s:nth-child(3)::after { animation-delay: .24s; }
.hero h1 .s:nth-child(4)::after { animation-delay: .36s; }
@keyframes arc { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hero h1 .s::after { animation: none; } }
.hero p.lead { font-size: 20px; line-height: 1.45; max-width: 30ch; margin: 0 0 28px; color: var(--ink); }

.cta {
  display: flex; align-items: center; gap: 16px; width: 100%;
  background: var(--sun); color: var(--sun-ink); border-radius: 26px; padding: 20px 22px;
  box-shadow: 0 3px 0 #d9a21c; cursor: pointer; transition: transform .1s, box-shadow .1s;
}
.cta:active { transform: translateY(3px); box-shadow: 0 0 0 #d9a21c; }
.cta.over { outline: 3px dashed var(--ink); outline-offset: 4px; }
.cta .ic { width: 56px; height: 56px; border-radius: 18px; background: rgba(255,255,255,.55); display: grid; place-items: center; flex: none; }
.cta .ic svg { width: 30px; height: 30px; }
.cta strong { display: block; font-size: 21px; font-weight: 750; line-height: 1.2; }
.cta span.sub { display: block; font-size: 15px; opacity: .8; margin-top: 2px; }
.cta input { display: none; }

.startrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin: 18px 0 0; }
.startrow .lbl { font-size: 15px; color: var(--muted); margin-right: 8px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--blue); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
.resume { margin: 14px 0 0; }
.btn-ghost { display: inline-flex; align-items: center; gap: 10px; border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 12px 20px; font-weight: 650; }

.how { list-style: none; counter-reset: s; margin: 44px 0 0; padding: 0; display: grid; gap: 14px; }
.how li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
.how li::before {
  content: counter(s); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; color: #fff; background: var(--blue);
}
.how li:nth-child(2)::before { background: var(--red); }
.how li:nth-child(3)::before { background: var(--ink); }
.how b { display: block; font-size: 17px; }
.how span { color: var(--muted); font-size: 16px; }

.foot { color: var(--muted); font-size: 14px; margin: 48px 0 0; max-width: 52ch; }

/* Leseansicht */
.pagecard { background: var(--page-bg); border-radius: 28px; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(23,25,59,.35); }
.orig { display: flex; justify-content: center; background: #e3e7fb; padding: 14px; }
.orig img { max-width: 100%; max-height: 280px; border-radius: 12px; display: block; }
.orig.hidden { display: none; }

.reader {
  background: var(--page-bg);
  font-family: var(--font);
  font-size: var(--size);
  letter-spacing: var(--ls);
  word-spacing: var(--ws);
  line-height: var(--lh);
  padding: 30px 26px 36px;
  min-height: 240px;
  color: #1d1d1f;
}
.reader p { margin: 0 0 0.8em; max-width: 30em; }
.reader p:last-child { margin-bottom: 0; }
.w { white-space: nowrap; cursor: pointer; border-radius: 8px; transition: background .12s; padding: 0 .02em; }
.w:hover { background: rgba(47,63,224,.08); }
.w.speaking { background: var(--sun); }
.mode-farbe .s0 { color: var(--s0); }
.mode-farbe .s1 { color: var(--s1); }
.mode-boegen .w .s { position: relative; display: inline-block; padding-bottom: .12em; }
.mode-boegen .w .s::after {
  content: ""; position: absolute; left: 6%; right: 6%; bottom: -.02em; height: .28em;
  border: .07em solid #555; border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
.mode-boegen .w .s.tiny::after { left: -10%; right: -10%; }
.mode-boegen.mode-farbe .w .s0::after { border-color: var(--s0); }
.mode-boegen.mode-farbe .w .s1::after { border-color: var(--s1); }

.status { padding: 48px 20px; text-align: center; color: var(--muted); font-family: var(--ui); font-size: 17px; }
.bar { height: 10px; background: var(--sky); border-radius: 99px; overflow: hidden; max-width: 280px; margin: 14px auto 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .2s; }

.edit { border-top: 1.5px solid var(--line); padding: 14px 22px 18px; font-family: var(--ui); background: #fff; }
.edit summary { cursor: pointer; font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 10px; list-style: none; }
.edit summary::-webkit-details-marker { display: none; }
.edit textarea { width: 100%; min-height: 150px; margin-top: 12px; padding: 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--sky); font-size: 17px; line-height: 1.5; resize: vertical; }
.edit .hint { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

.thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 16px 2px 4px; }
.thumbs button { flex: 0 0 auto; border: 0; border-radius: 12px; padding: 0; background: none; box-shadow: 0 0 0 2px transparent; }
.thumbs button.on { box-shadow: 0 0 0 3px var(--blue); }
.thumbs img, .thumbs .demo { width: 56px; height: 74px; object-fit: cover; border-radius: 12px; display: grid; place-items: center; }
.thumbs .demo { background: #fff; font-size: 12px; color: var(--muted); }
.thumbs .add { width: 56px; height: 74px; border-radius: 12px; border: 2px dashed #b7bde6; display: grid; place-items: center; color: var(--muted); cursor: pointer; flex: none; }

/* Werkzeugleiste unten */
.dock {
  position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
  background: var(--ink); color: #fff; box-shadow: 0 14px 34px -10px rgba(23,25,59,.6);
  max-width: calc(100vw - 20px);
}
.dock button { border: 0; background: none; color: inherit; height: 46px; min-width: 46px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; font-weight: 650; }
.dock button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.dock button:disabled { opacity: .35; cursor: default; }
.dock button.on { background: rgba(255,255,255,.18); }
.dock .read { background: var(--sun); color: var(--sun-ink); padding: 0 18px; }
.dock .read:hover:not(:disabled) { background: #ffd566; }
.dock .count { font-weight: 650; font-size: 15px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.dock .sep { width: 1px; height: 24px; background: rgba(255,255,255,.2); margin: 0 2px; }
@media (max-width: 440px) { .dock .read span, .dock .hide-sm { display: none; } .dock .read { padding: 0 14px; } .dock .count { min-width: 50px; } }

/* Einstellungen als Blatt über der Leiste */
.settings {
  position: fixed; left: 50%; transform: translate(-50%, 16px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 70px); z-index: 19;
  width: min(560px, calc(100vw - 20px)); max-height: 66vh; overflow-y: auto;
  background: #fff; border-radius: 28px; padding: 20px 20px 22px;
  box-shadow: 0 24px 60px -18px rgba(23,25,59,.45);
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
.settings.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .settings { transition: none; } }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
.grid .wide { grid-column: 1 / -1; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
.field > label, .field > .flabel { display: block; font-size: 15px; font-weight: 650; margin-bottom: 8px; }
.field select { width: 100%; padding: 11px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--sky); }
input[type=range] { width: 100%; accent-color: var(--blue); }
.seg { display: flex; background: var(--sky); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 11px; padding: 9px 6px; font-weight: 650; font-size: 15px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(23,25,59,.18); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 38px; height: 38px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); }
.swatches button.on { box-shadow: inset 0 0 0 1.5px var(--line), 0 0 0 3px #fff, 0 0 0 5.5px var(--ink); }

.own { display: inline-flex; gap: 8px; margin-left: 6px; padding-left: 14px; border-left: 1.5px solid var(--line); }
.pick { display: inline-flex; align-items: center; gap: 6px; background: var(--sky); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; font-weight: 650; cursor: pointer; }
.pick input { width: 30px; height: 30px; border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; }
.pick input::-webkit-color-swatch-wrapper { padding: 0; }
.pick input::-webkit-color-swatch { border: 0; border-radius: 50%; }
.pick input::-moz-color-swatch { border: 0; border-radius: 50%; }
@media (max-width: 480px) { .own { margin-left: 0; padding-left: 0; border-left: 0; } }

/* Lesemodus: nur der Text */
body.focus header.top, body.focus .orig, body.focus .edit, body.focus .thumbs, body.focus .settings, body.focus .foot, body.focus .dock > :not(.keep) { display: none !important; }
body.focus .wrap { max-width: none; padding: 0; }
body.focus .pagecard { border-radius: 0; box-shadow: none; min-height: 100vh; }
body.focus .reader { padding: 48px 7vw 120px; min-height: 100vh; }

.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 30; }
.toast.show { opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
  <symbol id="i-aa" viewBox="0 0 24 24"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 18v-4.5a2.5 2.5 0 0 1 5 0V18M15 15.5h5"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6zM12 6v14.5"/></symbol>
</svg>
<div class="wrap">
  <header class="top">
    <div class="brand" id="home" role="button" tabindex="0">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="6" width="17" height="28" rx="5" fill="#2f3fe0"/><rect x="21" y="6" width="17" height="28" rx="5" fill="#e5412d"/><path d="M6.5 26.5q4 4.5 8 0M25.5 26.5q4 4.5 8 0" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      <span class="name" data-t="docTitle"></span>
    </div>
    <div class="pill" id="uiLang" aria-label="Sprog / Sprache">
      <button data-v="da">DA</button>
      <button data-v="de">DE</button>
    </div>
  </header>

  <!-- Startseite -->
  <section id="start">
    <div class="hero">
      <h1 id="heroWord"></h1>
      <p class="lead" data-t="startIntro"></p>
      <label class="cta" id="drop">
        <input type="file" id="file" accept="image/*" multiple>
        <span class="ic"><svg class="i"><use href="#i-camera"/></svg></span>
        <span><strong data-t="dropMain"></strong><span class="sub" data-t="dropSub"></span></span>
      </label>
      <p class="resume" id="resumeWrap" hidden><button class="btn-ghost" id="resumeBtn"></button></p>
      <div class="startrow">
        <div id="langStart"><span class="lbl" data-t="bookLangColon"></span>
          <div class="pill">
            <button data-v="da" data-t="langDa"></button>
            <button data-v="de" data-t="langDe"></button>
          </div>
        </div>
        <button class="linkbtn" id="demoBtn" data-t="demo"></button>
      </div>
    </div>
    <ol class="how">
      <li><div><b data-t="how1t"></b><span data-t="how1"></span></div></li>
      <li><div><b data-t="how2t"></b><span data-t="how2"></span></div></li>
      <li><div><b data-t="how3t"></b><span data-t="how3"></span></div></li>
    </ol>
    <p class="foot" data-t="foot"></p>
  </section>

  <!-- Leseansicht -->
  <section id="app" hidden>
    <article class="pagecard">
      <div class="orig" id="orig"><img id="origImg" alt=""></div>
      <div class="reader" id="reader"></div>
      <details class="edit" id="edit">
        <summary><svg class="i"><use href="#i-pencil"/></svg><span data-t="editSummary"></span></summary>
        <textarea id="text" spellcheck="true"></textarea>
        <p class="hint" data-th="editHint"></p>
      </details>
    </article>
    <div class="thumbs" id="thumbs"></div>
  </section>
</div>

<nav class="dock" id="dock" hidden>
  <button id="homeBtn" data-ta="toStart"><svg class="i"><use href="#i-home"/></svg></button>
  <span class="sep hide-sm"></span>
  <button id="prev" data-ta="prevPage"><svg class="i"><use href="#i-prev"/></svg></button>
  <span class="count" id="count"></span>
  <button id="next" data-ta="nextPage"><svg class="i"><use href="#i-next"/></svg></button>
  <button class="read keep" id="readBtn"></button>
  <button id="setBtn" data-ta="adjust"><svg class="i"><use href="#i-aa"/></svg></button>
  <button class="keep" id="focusBtn"></button>
</nav>

<div class="settings" id="settings">
  <div class="grid">
    <div class="field wide">
      <span class="flabel" data-t="syllables"></span>
      <div class="seg" id="mode">
        <button data-v="aus" data-t="off"></button>
        <button data-v="farbe" data-t="color"></button>
        <button data-v="boegen" data-t="arcs"></button>
        <button data-v="beides" data-t="both"></button>
      </div>
    </div>
    <div class="field wide">
      <label for="font" data-t="font"></label>
      <select id="font">
        <option value='"Andika", sans-serif' data-t="andika"></option>
        <option value='"OpenDyslexic", sans-serif'>OpenDyslexic</option>
        <option value='"Atkinson Hyperlegible", sans-serif'>Atkinson Hyperlegible</option>
        <option value='"Lexend", sans-serif'>Lexend</option>
        <option value='Verdana, "DejaVu Sans", sans-serif'>Verdana</option>
      </select>
    </div>
    <div class="field wide">
      <label for="size" data-t="size"></label>
      <input type="range" id="size" min="18" max="64" step="1">
    </div>
    <div class="field">
      <label for="ls" data-t="letterSp"></label>
      <input type="range" id="ls" min="0" max="0.25" step="0.01">
    </div>
    <div class="field">
      <label for="lh" data-t="lineSp"></label>
      <input type="range" id="lh" min="1.3" max="3" step="0.1">
    </div>
    <div class="field wide">
      <span class="flabel" data-t="sylColors"></span>
      <div class="swatches" id="colors">
        <button data-v="#2f3fe0,#e5412d" style="background:linear-gradient(90deg,#2f3fe0 50%,#e5412d 50%)" data-ta="cBlueRed"></button>
        <button data-v="#2f3fe0,#17193b" style="background:linear-gradient(90deg,#2f3fe0 50%,#17193b 50%)" data-ta="cBlueBlack"></button>
        <button data-v="#e5412d,#17193b" style="background:linear-gradient(90deg,#e5412d 50%,#17193b 50%)" data-ta="cRedBlack"></button>
        <button data-v="#7a3fc2,#16804a" style="background:linear-gradient(90deg,#7a3fc2 50%,#16804a 50%)" data-ta="cPurpleGreen"></button>
        <span class="own">
          <label class="pick"><input type="color" id="c0"><span data-t="syl1"></span></label>
          <label class="pick"><input type="color" id="c1"><span data-t="syl2"></span></label>
        </span>
      </div>
    </div>
    <div class="field">
      <span class="flabel" data-t="background"></span>
      <div class="swatches" id="bg">
        <button data-v="#ffffff" style="background:#fff" data-ta="bWhite"></button>
        <button data-v="#fff8e6" style="background:#fff8e6" data-ta="bCream"></button>
        <button data-v="#fdf0b8" style="background:#fdf0b8" data-ta="bYellow"></button>
        <button data-v="#e6ecff" style="background:#e6ecff" data-ta="bBlue"></button>
        <button data-v="#e4f5e3" style="background:#e4f5e3" data-ta="bGreen"></button>
      </div>
    </div>
    <div class="field">

      background: "Hintergrund", bWhite: "Weiß", bCream: "Creme", bYellow: "Gelb", bBlue: "Hellblau", bGreen: "Hellgrün",
      original: "Originalseite", show: "Zeigen", hide: "Verbergen", origAlt: "Originalseite",
      editSummary: "Text prüfen und korrigieren",
      editHint: "Leere Zeile = neuer Absatz. Eigene Silbengrenzen mit · setzen, z.&nbsp;B. <b>O·ma</b>.",
      foot: "Alles passiert auf deinem eigenen Handy oder Computer. Die Fotos werden nirgendwohin geschickt.",
      noText: "Auf dieser Seite wurde kein Text gefunden.<br>Öffne „Text prüfen“ und tippe ihn selbst ein.",
      ocrFailed: "Die Erkennung hat nicht geklappt.",
      waiting: "Wartet auf Erkennung …", recognizing: "Text wird erkannt …", loadingCore: "Erkennung wird geladen …",

      example: "Beispiel", addPages: "Seiten hinzufügen", toStart: "Zur Startseite", resume: "Weiter mit den Seiten ({n})",
    },
  };
  const t = (k, vars = {}) => (T[S.ui] || T.da)[k]?.replace(/\{(\w+)\}/g, (_, v) => vars[v]) ?? k;
  const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
  function setReadBtn() { $("readBtn").innerHTML = icon(reading ? "stop" : "speak") + `<span>${t(reading ? "stop" : "read")}</span>`; }
  function setFocusBtn() {
    const on = document.body.classList.contains("focus");
    $("focusBtn").innerHTML = icon(on ? "close" : "focus");
    $("focusBtn").setAttribute("aria-label", t(on ? "close" : "focus")); $("focusBtn").title = t(on ? "close" : "focus");
  }
  function applyTexts() {
    document.documentElement.lang = S.ui;

    setReadBtn(); setFocusBtn();
    const hw = $("heroWord"); hw.innerHTML = "";
    t("heroWord").split("·").forEach((x, i) => { const s = document.createElement("span"); s.className = "s s" + (i % 2); s.textContent = x; hw.append(s); });
    hw.setAttribute("aria-label", t("docTitle"));
    $("resumeBtn").innerHTML = icon("book") + t("resume", { n: pages.length });
    if (pages.length) render();
  }

  function applySettings() {
    const r = document.documentElement.style;
    r.setProperty("--font", S.font);
    r.setProperty("--size", S.size + "px");
    r.setProperty("--ls", S.ls + "em");
    r.setProperty("--lh", S.lh);
    const [c0, c1] = S.colors.split(",");
    r.setProperty("--s0", c0); r.setProperty("--s1", c1);

    r.setProperty("--page-bg", S.bg);
    const rd = $("reader");
    rd.classList.toggle("mode-farbe", S.mode === "farbe" || S.mode === "beides");
    rd.classList.toggle("mode-boegen", S.mode === "boegen" || S.mode === "beides");
    $("font").value = S.font; $("size").value = S.size; $("ls").value = S.ls; $("lh").value = S.lh;
    for (const [id, key] of [["mode", "mode"], ["colors", "colors"], ["bg", "bg"], ["origToggle", "orig"], ["langStart", "lang"], ["langSet", "lang"], ["uiLang", "ui"]])
      $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === S[key]));
    $("orig").classList.toggle("hidden", S.orig === "aus" || !pages[cur]?.img);

  }
  $("font").onchange = e => { S.font = e.target.value; applySettings(); };

  for (const [id, key] of [["mode", "mode"], ["colors", "colors"], ["bg", "bg"], ["origToggle", "orig"], ["langStart", "lang"], ["langSet", "lang"], ["uiLang", "ui"]])
    $(id).onclick = e => { const b = e.target.closest("button"); if (b) {
      S[key] = b.dataset.v; applySettings();
      if (key === "ui") applyTexts();
      if (key === "lang" && pages[cur] && pages[cur].lang !== S.lang) relang(pages[cur]);
    } };
  $("setBtn").onclick = () => $("setBtn").classList.toggle("on", $("settings").classList.toggle("open"));
  for (const [i, id] of ["c0", "c1"].entries())
    $(id).oninput = e => { const c = S.colors.split(","); c[i] = e.target.value; S.colors = c.join(","); applySettings(); };
  $("focusBtn").onclick = () => {
    const on = document.body.classList.toggle("focus");
    setFocusBtn();
    window.scrollTo(0, 0);
  };

  function toast(msg, ms = 2600) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
  }

  // ---------- Seiten ----------
  const pages = [];   // { img: dataURL|null, text: string, status: 'wait'|'ocr'|'done'|'error', progress }
  let cur = 0;

  // ---------- Text aufbereiten ----------
  // OCR liefert Zeilen so, wie sie im Buch umbrechen. Wir fügen sie zu Absätzen zusammen.
  function cleanOcr(raw) {
    return raw
      .replace(/\r/g, "")
      .replace(/[|]/g, "I")
      .replace(/(\p{Ll})[-¬]\n(\p{Ll})/gu, "$1$2")     // Trennstrich am Zeilenende entfernen
      .split(/\n\s*\n+/)
      .map(p => p.replace(/\s*\n\s*/g, " ").replace(/\s{2,}/g, " ").trim())
      .filter(p => p.length > 0 && /\p{L}/u.test(p))
      // Absatz ohne Satzende am Schluss gehört meist noch zum nächsten Absatz
      .reduce((acc, p) => {
        if (acc.length && !/[.!?…:"“”»«]$/.test(acc[acc.length - 1])) acc[acc.length - 1] += " " + p;
        else acc.push(p);
        return acc;
      }, [])
      .join("\n\n");
  }

  // Text -> HTML mit Wort- und Silben-Spans. Gleichzeitig Zeichenpositionen für das Vorlesen merken.
  const WORD = /[\p{L}\p{M}·]+/gu;
  function renderText(text, lang) {
    const rd = $("reader");
    rd.innerHTML = "";
    const plainParts = [];
    let offset = 0, wordIndex = 0;
    const wordPos = [];
    text.split(/\n\s*\n/).forEach((para, pi) => {
      const p = document.createElement("p");
      let last = 0;
      const plain = para.replace(/\n/g, " ").replace(/·/g, "");
      for (const m of para.replace(/\n/g, " ").matchAll(WORD)) {
        if (m.index > last) p.append(para.replace(/\n/g, " ").slice(last, m.index));
        const raw = m[0];
        const word = raw.replace(/·/g, "");
        const parts = raw.includes("·") ? raw.split("·").filter(Boolean) : Silben.silben(word, lang);
        const w = document.createElement("span");
        w.className = "w"; w.dataset.word = word; w.dataset.i = wordIndex++;
        parts.forEach((sil, i) => {
          const s = document.createElement("span");
          s.className = "s s" + (i % 2) + (sil.length < 2 ? " tiny" : ""); s.textContent = sil;
          w.append(s);
        });
        p.append(w);
        last = m.index + raw.length;
      }
      if (last < para.length) p.append(para.slice(last));
      rd.append(p);
      plainParts.push(plain);
    });
    // Zeichenpositionen im Vorlesetext
    const full = plainParts.join("\n");
    let idx = 0;
    for (const m of full.matchAll(/[\p{L}\p{M}]+/gu)) wordPos.push({ start: m.index, end: m.index + m[0].length, i: idx++ });
    rd._speech = { full, wordPos };
  }

  function showStatus(html) {
    $("reader").innerHTML = `<div class="status">${html}</div>`;
    $("reader")._speech = null;
  }

  function render() {
    const pg = pages[cur];
    $("count").textContent = t("pageOf", { a: cur + 1, b: pages.length });
    $("prev").disabled = cur === 0; $("next").disabled = cur >= pages.length - 1;
    if (pg.img) $("origImg").src = pg.img;
    stopSpeech();
    if (pg.status === "done") {
      renderText(pg.text, pg.lang);
      $("text").value = pg.text;
      $("edit").hidden = false;
      $("readBtn").disabled = !pg.text;
      if (!pg.text) showStatus(t("noText"));
    } else if (pg.status === "error") {
      showStatus(t("ocrFailed") + "<br>" + (pg.error || ""));
      $("text").value = ""; $("readBtn").disabled = true;
    } else {
      const pct = Math.round((pg.progress || 0) * 100);
      showStatus(`<span>${t(pg.status === "wait" ? "waiting" : pg.stage || "recognizing")}</span><div class="bar"><i style="width:${pct}%"></i></div>`);
      $("readBtn").disabled = true;
    }
    applySettings();
    renderThumbs();
  }

  function renderThumbs() {
    const box = $("thumbs"); box.innerHTML = "";
    pages.forEach((pg, i) => {
      const b = document.createElement("button");
      b.className = i === cur ? "on" : ""; b.title = t("page") + " " + (i + 1);
      b.innerHTML = pg.img ? `<img src="${pg.img}" alt="">` : `<span class="demo">${t("example")}</span>`;
      b.onclick = () => { cur = i; render(); };
      box.append(b);
    });
    const add = document.createElement("label");
    add.className = "add"; add.title = t("addPages"); add.innerHTML = icon("plus") + `<input type="file" accept="image/*" multiple hidden>`;
    add.querySelector("input").onchange = e => addFiles(e.target.files);
    box.append(add);
  }

  $("prev").onclick = () => { if (cur > 0) { cur--; render(); } };
  $("next").onclick = () => { if (cur < pages.length - 1) { cur++; render(); } };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "Escape" && document.body.classList.contains("focus")) $("focusBtn").click();
  });

  let editT;
  $("text").oninput = e => {
    clearTimeout(editT);
    editT = setTimeout(() => { pages[cur].text = e.target.value; renderText(pages[cur].text, pages[cur].lang); }, 250);
  };

  // ---------- Bilder laden ----------
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        // Große Handyfotos verkleinern: schneller und für die Erkennung völlig ausreichend.
        const max = 2200, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res({ dataUrl: c.toDataURL("image/jpeg", 0.88), canvas: c });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(t("imgError"))); };
      img.src = url;
    });
  }

  const queue = [];
  async function addFiles(files) {
    const list = [...files].filter(f => f.type.startsWith("image/"));
    if (!list.length) return;
    showApp();
    const first = pages.length;
    for (const f of list) {
      try {
        const { dataUrl, canvas } = await loadImage(f);
        const pg = { img: dataUrl, canvas, lang: S.lang, text: "", status: "wait", progress: 0 };
        pages.push(pg); queue.push(pg);
      } catch (e) { toast(e.message); }
    }
    cur = Math.min(first, pages.length - 1);
    render();
    runQueue();
  }

  // ---------- Texterkennung ----------
  const workers = {}; let active = null;
  const OCR_LANG = { da: "dan", de: "deu" };
  const loadScript = (src) => new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("Datei fehlt: " + src));
    document.head.append(s);
  });
  function getWorker(lang) {
    const code = OCR_LANG[lang] || "dan";
    if (!workers[code]) {
      const p = workers[code] = loadScript(`lang/${code}.js`)
        .then(() => Uint8Array.from(atob(window.TRAINEDDATA[code]), c => c.charCodeAt(0)))
        .then(bytes => Tesseract.createWorker([{ code, data: bytes }], 1, {
        workerPath: abs("worker.min.js"),
        corePath: abs("core"),
        workerBlobURL: false,
        cacheMethod: "none",
        logger: m => {
          if (!active) return;
          const names = { "loading tesseract core": "loadingCore", "loading language traineddata": "loadingLang", "initializing api": "preparing", "recognizing text": "recognizing" };
          active.stage = names[m.status] || active.stage;
          active.progress = m.status === "recognizing text" ? m.progress : (active.progress || 0);
          if (pages[cur] === active) {
            const bar = document.querySelector(".status .bar i");
            const st = document.querySelector(".status");
            if (st && st.firstChild) st.firstChild.textContent = t(active.stage);
            if (bar) bar.style.width = Math.round(active.progress * 100) + "%";
          }
        },
      })).then(async w => { await w.setParameters({ preserve_interword_spaces: "1" }); return w; });
      p.catch(() => { delete workers[code]; });
    }
    return workers[code];
  }

  let running = false;
  async function runQueue() {
    if (running) return; running = true;
    while (queue.length) {
      const pg = queue.shift();
      active = pg; pg.status = "ocr"; pg.stage = "loadingCore";
      if (pages[cur] === pg) render();
      try {
        const w = await getWorker(pg.lang);
        const { data } = await w.recognize(pg.canvas);
        pg.text = cleanOcr(data.text || "");
        pg.status = "done";
      } catch (e) {
        console.error(e);
        pg.status = "error"; pg.error = String(e && e.message || e);
      }
      active = null;
      if (pages[cur] === pg) render(); else renderThumbs();
    }
    running = false;
  }

  // ---------- Vorlesen ----------
  const synth = window.speechSynthesis;
  const SPEECH = { da: "da-DK", de: "de-DE" };
  function pickVoice(lang) {
    if (!synth) return null;
    const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(lang));
    return vs.find(v => /google|premium|enhanced|natural/i.test(v.name)) || vs[0] || null;
  }
  if (synth) synth.getVoices();

  function speak(text, onBoundary, onEnd) {
    if (!synth) { toast(t("noSpeech")); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = pages[cur]?.lang || S.lang;
    u.lang = SPEECH[lang]; const voice = pickVoice(lang); if (voice) u.voice = voice;
    u.rate = 0.85;
    if (onBoundary) u.onboundary = onBoundary;
    u.onend = u.onerror = () => onEnd && onEnd();
    synth.speak(u);
  }
  function clearHighlight() { document.querySelectorAll(".w.speaking").forEach(x => x.classList.remove("speaking")); }
  function stopSpeech() { if (synth) synth.cancel(); clearHighlight(); reading = false; setReadBtn(); }

  $("reader").onclick = e => {
    if ($("settings").classList.contains("open")) { $("settings").classList.remove("open"); $("setBtn").classList.remove("on"); return; }
    const w = e.target.closest(".w"); if (!w) return;
    stopSpeech();
    w.classList.add("speaking");
    speak(w.dataset.word, null, () => w.classList.remove("speaking"));
  };

  let reading = false;
  $("readBtn").onclick = () => {
    if (reading) { stopSpeech(); return; }
    const sp = $("reader")._speech; if (!sp) return;
    const spans = [...$("reader").querySelectorAll(".w")];
    reading = true; setReadBtn();
    speak(sp.full, ev => {
      if (ev.name && ev.name !== "word") return;
      const hit = sp.wordPos.find(p => ev.charIndex >= p.start && ev.charIndex < p.end) || sp.wordPos.find(p => p.start >= ev.charIndex);
      clearHighlight();
      if (hit && spans[hit.i]) spans[hit.i].classList.add("speaking");
    }, () => { reading = false; clearHighlight(); setReadBtn(); });
  };

  const DEMO = {
    da: "Det lille pindsvin bor under et stort æbletræ.\n\n" +
        "Hver morgen snuser det til blomsterne. Så leder det efter biller og orme i haven.\n\n" +
        "I dag regner det. Pindsvinet ruller sig sammen og falder i søvn.",
    de: "Der kleine Igel wohnt unter einem großen Apfelbaum.\n\n" +
        "Jeden Morgen schnuppert er an den Blumen. Dann sucht er Käfer und Würmer im Garten.\n\n" +
        "Heute regnet es. Der Igel rollt sich zusammen und schläft ein.",
  };

  // Sprache einer Seite nachträglich ändern: Fotoseiten neu erkennen, Beispielseite austauschen.
  function relang(pg) {
    pg.lang = S.lang;
    if (pg.canvas) { pg.status = "wait"; pg.progress = 0; queue.push(pg); render(); runQueue(); }
    else { if (Object.values(DEMO).includes(pg.text)) pg.text = DEMO[pg.lang]; render(); }
  }

  // ---------- Start ----------
  function showApp() { $("start").hidden = true; $("app").hidden = false; $("dock").hidden = false; window.scrollTo(0, 0); }
  function showStart() {
    stopSpeech();
    if (document.body.classList.contains("focus")) $("focusBtn").click();
    $("app").hidden = true; $("start").hidden = false; $("dock").hidden = true; $("settings").classList.remove("open");
    $("resumeWrap").hidden = !pages.length;
    $("resumeBtn").innerHTML = icon("book") + t("resume", { n: pages.length });
    window.scrollTo(0, 0);
  }
  $("homeBtn").onclick = showStart;
  $("home").onclick = showStart;
  $("home").onkeydown = e => { if (e.key === "Enter") showStart(); };
  $("resumeBtn").onclick = () => { showApp(); render(); };

  const drop = $("drop");
  $("file").onchange = e => addFiles(e.target.files);
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
  document.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])]; if (f.length) addFiles(f); });

  $("demoBtn").onclick = () => {
    pages.push({ img: null, status: "done", lang: S.lang, text: DEMO[S.lang] });
    cur = pages.length - 1; showApp(); render();
    getWorker(S.lang); // Erkennung im Hintergrund schon vorladen
  };

  applySettings();
  applyTexts();
})();
</script>
</body>
</html>
