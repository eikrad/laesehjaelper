<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Læsehjælper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "OpenDyslexic"; font-weight: 400; src: url(data:font/woff2;base64,%%OD_400%%) format("woff2"); }
@font-face { font-family: "OpenDyslexic"; font-weight: 700; src: url(data:font/woff2;base64,%%OD_700%%) format("woff2"); }

:root {
  /* Farben */
  --sky: #f2f3f5;        /* App-Hintergrund, neutrales Hellgrau */
  --ink: #1d2131;        /* Text und Hauptknöpfe */
  --muted: #646a7c;
  --line: #e0e3e9;
  --surface: #ffffff;
  --blue: #2e4fd1;       /* erste Silbe, Links */
  --red: #d9473b;        /* zweite Silbe */
  --mark: #fde68a;       /* Markierung beim Vorlesen */
  /* Silben im Lesetext (einstellbar) */
  --s0: var(--blue);
  --s1: var(--red);
  --page-bg: #ffffff;
  --font: "Andika", sans-serif;
  --size: 32px;
  --ls: 0.04em;
  --ws: 0.25em;
  --lh: 1.9;
  --ui: "Atkinson Hyperlegible", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--ui);
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--sky);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 18px 120px; }

/* Kopfzeile */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 8px; }
.brand { display: flex; align-items: center; gap: 9px; cursor: pointer; border-radius: 10px; }
.brand .name { font-size: 18px; font-weight: 700; }
.logo { width: 34px; height: 20px; }
.pill { display: inline-flex; background: #fff; border-radius: 999px; padding: 3px; box-shadow: inset 0 0 0 1.5px var(--line); }
.pill button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; color: var(--muted); }
.pill button.on { background: var(--ink); color: #fff; }

/* Startseite */
.hero { padding: 40px 0 8px; }
.hero h1 {
  font-size: clamp(44px, 12vw, 76px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700;
  margin: 0 0 26px; padding-bottom: .26em; color: var(--ink);
}
.hero h1 .s { position: relative; display: inline-block; }
.hero h1 .s0::after { border-color: var(--blue); } .hero h1 .s1::after { border-color: var(--red); }
.hero h1 .s::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: -.24em; height: .16em;
  border-style: solid; border-width: 0 .045em .045em; border-radius: 0 0 50% 50% / 0 0 100% 100%;
  transform-origin: center; animation: arc .5s cubic-bezier(.3,1.4,.6,1) both;
}
.hero h1 .s:nth-child(2)::after { animation-delay: .12s; }
.hero h1 .s:nth-child(3)::after { animation-delay: .24s; }
.hero h1 .s:nth-child(4)::after { animation-delay: .36s; }
@keyframes arc { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hero h1 .s::after { animation: none; } }
.hero p.lead { font-size: 19px; line-height: 1.5; max-width: 34ch; margin: 0 0 30px; color: var(--muted); }

.cta {
  display: flex; align-items: center; gap: 16px; width: 100%;
  background: var(--ink); color: #fff; border-radius: 16px; padding: 18px 20px;
  cursor: pointer; transition: background .15s;
}
.cta:hover { background: #2b3045; }
.cta.over { outline: 3px dashed var(--ink); outline-offset: 4px; }
.cta .ic { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.1); display: grid; place-items: center; flex: none; }
.cta .ic svg { width: 26px; height: 26px; }
.cta strong { display: block; font-size: 19px; font-weight: 700; line-height: 1.25; }
.cta span.sub { display: block; font-size: 15px; opacity: .7; margin-top: 2px; }
.cta input { display: none; }

.startrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin: 18px 0 0; }
.startrow .lbl { font-size: 15px; color: var(--muted); margin-right: 8px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.resume { margin: 14px 0 0; }
.btn-ghost { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); border-radius: 12px; padding: 11px 18px; font-weight: 700; }

.how { list-style: none; counter-reset: s; margin: 48px 0 0; padding: 22px 0 0; display: grid; gap: 16px; border-top: 1px solid var(--line); }
.how li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: baseline; }
.how li::before { content: counter(s); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.how b { display: block; font-size: 17px; }
.how span { color: var(--muted); font-size: 16px; }

.foot { color: var(--muted); font-size: 14px; margin: 48px 0 0; max-width: 52ch; }

/* Leseansicht */
.pagecard { background: var(--page-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.orig { display: flex; justify-content: center; background: #e9ebef; padding: 14px; }
.orig img { max-width: 100%; max-height: 280px; border-radius: 12px; display: block; }
.orig.hidden { display: none; }

.reader {
  background: var(--page-bg);
  font-family: var(--font);
  font-size: var(--size);
  letter-spacing: var(--ls);
  word-spacing: var(--ws);
  line-height: var(--lh);
  padding: 30px 26px 36px;
  min-height: 240px;
  color: #1d1d1f;
}
.reader p { margin: 0 0 0.8em; max-width: 30em; }
.reader p:last-child { margin-bottom: 0; }
.w { white-space: nowrap; cursor: pointer; border-radius: 8px; transition: background .12s; padding: 0 .02em; }
.w:hover { background: rgba(47,63,224,.08); }
.w.speaking { background: var(--mark); }
.mode-farbe .s0 { color: var(--s0); }
.mode-farbe .s1 { color: var(--s1); }
.mode-boegen .w .s { position: relative; display: inline-block; padding-bottom: .12em; }
.mode-boegen .w .s::after {
  content: ""; position: absolute; left: 6%; right: 6%; bottom: -.02em; height: .28em;
  border: .07em solid #555; border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
.mode-boegen .w .s.tiny::after { left: -10%; right: -10%; }
.mode-boegen.mode-farbe .w .s0::after { border-color: var(--s0); }
.mode-boegen.mode-farbe .w .s1::after { border-color: var(--s1); }

.reader.pagemode { padding: 0; min-height: 0; }
.pageview { position: relative; line-height: 0; }
.pageview > img { width: 100%; display: block; }
.tbox { position: absolute; overflow: hidden; line-height: min(var(--lh), 1.6); word-spacing: .12em; }
.tbox p { margin: 0 0 .35em; max-width: none; }
.tbox p:last-child { margin-bottom: 0; }
.tbox.busy { border-radius: 12px; padding: 0 .3em; }
.status { padding: 48px 20px; text-align: center; color: var(--muted); font-family: var(--ui); font-size: 17px; }
.bar { height: 10px; background: var(--sky); border-radius: 99px; overflow: hidden; max-width: 280px; margin: 14px auto 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .2s; }

.edit { border-top: 1.5px solid var(--line); padding: 14px 22px 18px; font-family: var(--ui); background: #fff; }
.edit summary { cursor: pointer; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 10px; list-style: none; }
.edit summary::-webkit-details-marker { display: none; }
.edit textarea { width: 100%; min-height: 150px; margin-top: 12px; padding: 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--sky); font-size: 17px; line-height: 1.5; resize: vertical; }
.edit .hint { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

.thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 16px 2px 4px; }
.thumbs button { flex: 0 0 auto; border: 0; border-radius: 12px; padding: 0; background: none; box-shadow: 0 0 0 2px transparent; }
.thumbs button.on { box-shadow: 0 0 0 3px var(--blue); }
.thumbs img, .thumbs .demo { width: 56px; height: 74px; object-fit: cover; border-radius: 12px; display: grid; place-items: center; }
.thumbs .demo { background: #fff; font-size: 12px; color: var(--muted); }
.thumbs .add { width: 56px; height: 74px; border-radius: 12px; border: 2px dashed #b7bde6; display: grid; place-items: center; color: var(--muted); cursor: pointer; flex: none; }

/* Werkzeugleiste unten */
.dock {
  position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
  background: var(--ink); color: #fff; box-shadow: 0 14px 34px -10px rgba(23,25,59,.6);
  max-width: calc(100vw - 20px);
}
.dock button { border: 0; background: none; color: inherit; height: 46px; min-width: 46px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; font-weight: 700; }
.dock button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.dock button:disabled { opacity: .35; cursor: default; }
.dock button.on { background: rgba(255,255,255,.18); }
.dock .read { background: #fff; color: var(--ink); padding: 0 18px; }
.dock .read:hover:not(:disabled) { background: #e9ebf0; }
.dock .count { font-weight: 700; font-size: 15px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.dock .sep { width: 1px; height: 24px; background: rgba(255,255,255,.2); margin: 0 2px; }
@media (max-width: 440px) { .dock .read span, .dock .hide-sm { display: none; } .dock .read { padding: 0 14px; } .dock .count { min-width: 50px; } }

/* Einstellungen als Blatt über der Leiste */
.settings {
  position: fixed; left: 50%; transform: translate(-50%, 16px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 70px); z-index: 19;
  width: min(560px, calc(100vw - 20px)); max-height: 66vh; overflow-y: auto;
  background: #fff; border-radius: 18px; padding: 20px 20px 22px;
  box-shadow: 0 24px 60px -18px rgba(23,25,59,.45);
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
.settings.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .settings { transition: none; } }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
.grid .wide { grid-column: 1 / -1; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
.field > label, .field > .flabel { display: block; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.field select { width: 100%; padding: 11px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--sky); }
input[type=range] { width: 100%; accent-color: var(--blue); }
.seg { display: flex; background: var(--sky); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 11px; padding: 9px 6px; font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(23,25,59,.18); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 38px; height: 38px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); }
.swatches button.on { box-shadow: inset 0 0 0 1.5px var(--line), 0 0 0 3px #fff, 0 0 0 5.5px var(--ink); }

/* Zuschnitt */
.crop { position: fixed; inset: 0; z-index: 40; background: #14171f; color: #fff; display: flex; flex-direction: column; }
.crop-head { padding: max(14px, env(safe-area-inset-top)) 18px 10px; }
.crop-head strong { display: block; font-size: 18px; }
.crop-head span { display: block; font-size: 15px; opacity: .75; margin-top: 2px; }
.crop-stage { position: relative; flex: 1; margin: 6px 14px; touch-action: none; }
.crop-stage canvas { position: absolute; display: block; }
.crop-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.crop-stage polygon { fill: rgba(46,79,209,.12); stroke: #fff; stroke-width: 2; }
.crop-stage .h { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; touch-action: none; cursor: grab; }
.crop-stage .h::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--blue); }
.crop-foot { display: flex; justify-content: space-between; gap: 12px; padding: 12px 18px max(16px, env(safe-area-inset-bottom)); }
.crop-foot .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.cta-sm { border: 0; background: #fff; color: var(--ink); border-radius: 12px; padding: 11px 22px; font-weight: 700; }
.recrop { margin-top: 12px; }
.fhint { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.own { display: inline-flex; gap: 8px; margin-left: 6px; padding-left: 14px; border-left: 1.5px solid var(--line); }
.pick { display: inline-flex; align-items: center; gap: 6px; background: var(--sky); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
.pick input { width: 30px; height: 30px; border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; }
.pick input::-webkit-color-swatch-wrapper { padding: 0; }
.pick input::-webkit-color-swatch { border: 0; border-radius: 50%; }
.pick input::-moz-color-swatch { border: 0; border-radius: 50%; }
@media (max-width: 480px) { .own { margin-left: 0; padding-left: 0; border-left: 0; } }

/* Lesemodus: nur der Text */
body.focus header.top, body.focus .orig, body.focus .edit, body.focus .thumbs, body.focus .settings, body.focus .foot, body.focus .dock > :not(.keep) { display: none !important; }
body.focus .wrap { max-width: none; padding: 0; }
body.focus .pagecard { border-radius: 0; box-shadow: none; min-height: 100vh; }
body.focus .reader { padding: 48px 7vw 120px; min-height: 100vh; }

.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 30; }
.toast.show { opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
  <symbol id="i-aa" viewBox="0 0 24 24"><path d="M3 18 8 6l5 12M4.8 14h6.4M15 18v-4.5a2.5 2.5 0 0 1 5 0V18M15 15.5h5"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6zM12 6v14.5"/></symbol>
</svg>
<div class="wrap">
  <header class="top">
    <div class="brand" id="home" role="button" tabindex="0">
      <svg class="logo" viewBox="0 0 34 20" aria-hidden="true"><path d="M3 5a7 7 0 0 0 14 0" stroke="#2e4fd1" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M17 5a7 7 0 0 0 14 0" stroke="#d9473b" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>
      <span class="name" data-t="docTitle"></span>
    </div>
    <div class="pill" id="uiLang" aria-label="Sprog / Sprache">
      <button data-v="da">DA</button>
      <button data-v="de">DE</button>
    </div>
  </header>

  <!-- Startseite -->
  <section id="start">
    <div class="hero">
      <h1 id="heroWord"></h1>
      <p class="lead" data-t="startIntro"></p>
      <label class="cta" id="drop">
        <input type="file" id="file" accept="image/*" multiple>
        <span class="ic"><svg class="i"><use href="#i-camera"/></svg></span>
        <span><strong data-t="dropMain"></strong><span class="sub" data-t="dropSub"></span></span>
      </label>
      <p class="resume" id="resumeWrap" hidden><button class="btn-ghost" id="resumeBtn"></button></p>
      <div class="startrow">
        <div id="langStart"><span class="lbl" data-t="bookLangColon"></span>
          <div class="pill">
            <button data-v="da" data-t="langDa"></button>
            <button data-v="de" data-t="langDe"></button>
          </div>
        </div>
        <button class="linkbtn" id="demoBtn" data-t="demo"></button>
      </div>
    </div>
    <ol class="how">
      <li><div><b data-t="how1t"></b><span data-t="how1"></span></div></li>
      <li><div><b data-t="how2t"></b><span data-t="how2"></span></div></li>
      <li><div><b data-t="how3t"></b><span data-t="how3"></span></div></li>
    </ol>
    <p class="foot" data-t="foot"></p>
  </section>

  <!-- Leseansicht -->
  <section id="app" hidden>
    <article class="pagecard">
      <div class="orig" id="orig"><img id="origImg" alt=""></div>
      <div class="reader" id="reader"></div>
      <details class="edit" id="edit">
        <summary><svg class="i"><use href="#i-pencil"/></svg><span data-t="editSummary"></span></summary>
        <textarea id="text" spellcheck="true"></textarea>
        <p class="hint" data-th="editHint"></p>
        <button class="btn-ghost recrop" id="recropBtn"><svg class="i"><use href="#i-crop"/></svg><span data-t="cropAgain"></span></button>
      </details>
    </article>
    <div class="thumbs" id="thumbs"></div>
  </section>
</div>

<nav class="dock" id="dock" hidden>
  <button id="homeBtn" data-ta="toStart"><svg class="i"><use href="#i-home"/></svg></button>
  <span class="sep hide-sm"></span>
  <button id="prev" data-ta="prevPage"><svg class="i"><use href="#i-prev"/></svg></button>
  <span class="count" id="count"></span>
  <button id="next" data-ta="nextPage"><svg class="i"><use href="#i-next"/></svg></button>
  <button class="read keep" id="readBtn"></button>
  <button id="setBtn" data-ta="adjust"><svg class="i"><use href="#i-aa"/></svg></button>
  <button class="keep" id="focusBtn"></button>
</nav>

<div class="settings" id="settings">
  <div class="grid">
    <div class="field wide">
      <span class="flabel" data-t="view"></span>
      <div class="seg" id="viewSet">
        <button data-v="side" data-t="viewPage"></button>
        <button data-v="tekst" data-t="viewText"></button>
      </div>
    </div>
    <div class="field wide">
      <span class="flabel" data-t="syllables"></span>
      <div class="seg" id="mode">
        <button data-v="aus" data-t="off"></button>
        <button data-v="farbe" data-t="color"></button>
        <button data-v="boegen" data-t="arcs"></button>
        <button data-v="beides" data-t="both"></button>
      </div>
    </div>
    <div class="field wide">
      <label for="font" data-t="font"></label>
      <select id="font">
        <option value='"Andika", sans-serif' data-t="andika"></option>
        <option value='"OpenDyslexic", sans-serif'>OpenDyslexic</option>
        <option value='"Atkinson Hyperlegible", sans-serif'>Atkinson Hyperlegible</option>
        <option value='"Lexend", sans-serif'>Lexend</option>
        <option value='Verdana, "DejaVu Sans", sans-serif'>Verdana</option>
      </select>
    </div>
    <div class="field wide">
      <label for="size" data-t="size"></label>
      <input type="range" id="size" min="18" max="64" step="1">
    </div>
    <div class="field">
      <label for="ls" data-t="letterSp"></label>

  const t = (k, vars = {}) => (T[S.ui] || T.da)[k]?.replace(/\{(\w+)\}/g, (_, v) => vars[v]) ?? k;

  // Text -> HTML mit Wort- und Silben-Spans. Gleichzeitig Zeichenpositionen für das Vorlesen merken.
  const WORD = /[\p{L}\p{M}·]+(?:-[\p{L}\p{M}·]+)*/gu;
  // Silben eines Wortes: „·“ = feste Silbengrenze (vom Buch oder selbst gesetzt), „-“ = echter Bindestrich.
  // Jedes Stück wird zusätzlich automatisch getrennt.
  function wordSyllables(raw, lang) {
    const out = [];
    raw.split("-").forEach((piece, k, all) => {
      const sy = piece.split("·").filter(Boolean).flatMap(x => Silben.silben(x, lang));
      if (k < all.length - 1 && sy.length) sy[sy.length - 1] += "-";
      out.push(...sy);
    });
    return out;
  }
  function buildText(text, lang) {
    const ps = [];
    const plainParts = [];
    let offset = 0, wordIndex = 0;
    const wordPos = [];
    text.split(/\n\s*\n/).forEach((para, pi) => {
      const p = document.createElement("p");
      let last = 0;
      const plain = para.replace(/\n/g, " ").replace(/·/g, "");
      for (const m of para.replace(/\n/g, " ").matchAll(WORD)) {
        if (m.index > last) p.append(para.replace(/\n/g, " ").slice(last, m.index));
        const raw = m[0];
        const word = raw.replace(/·/g, "");
        const parts = wordSyllables(raw, lang);
        const w = document.createElement("span");
        w.className = "w"; w.dataset.word = word; w.dataset.i = wordIndex++;

          w.append(s);
        });
        p.append(w);
        last = m.index + raw.length;
      }
      if (last < para.length) p.append(para.slice(last));
      ps.push(p);
      plainParts.push(plain);
    });
    // Zeichenpositionen im Vorlesetext
    const full = plainParts.join("\n");
    let idx = 0;
    for (const m of full.matchAll(/[\p{L}\p{M}]+/gu)) wordPos.push({ start: m.index, end: m.index + m[0].length, i: idx++ });
    return { ps, speech: { full, wordPos } };
  }

  const isPageMode = (pg) => !!(S.view === "side" && pg && pg.clean && pg.paras && pg.paras.length > 0);

  // Inhalt einer fertig erkannten Seite zeigen: als Buchseite oder als reiner Text.
  function renderContent(pg) {
    const rd = $("reader");

    rd.innerHTML = ""; rd._speech = speech;
    const page = isPageMode(pg);

    const img = new Image(); img.src = pg.clean; img.alt = ""; pv.append(img);

      const own = i === pg.paras.length - 1 ? ps.slice(i) : ps.slice(i, i + 1);
      own.forEach(p => box.append(p));
      pv.append(box);

  // Schriftgröße je Textfeld so wählen, dass der Text genau in die Fläche der alten Schrift passt.
  function fitBoxes() {
    document.querySelectorAll(".pageview .tbox").forEach(box => {
      const h = box.clientHeight, w = box.clientWidth;
      if (!h || !w) return;
      // höchstens gut doppelt so groß wie die Originalschrift
      const maxFs = parseFloat(box.dataset.lh || 1) * box.parentElement.clientHeight * 2.4;
      let lo = 4, hi = Math.max(8, Math.min(h, maxFs));
      for (let k = 0; k < 12; k++) {
        const mid = (lo + hi) / 2;
        box.style.fontSize = mid + "px";
        if (box.scrollHeight <= h + 1 && box.scrollWidth <= w + 1) lo = mid; else hi = mid;
      }
      box.style.fontSize = lo + "px";
      box._fs = lo;
    });

    const boxes = [...document.querySelectorAll(".pageview .tbox")];
    boxes.forEach(a => {
      const la = parseFloat(a.dataset.lh);
      const same = boxes.filter(b => Math.abs(parseFloat(b.dataset.lh) - la) / la < 0.2);
      a.style.fontSize = Math.min(...same.map(b => b._fs)) + "px";

  // Alte Schrift aus dem Foto entfernen: jede Zeile mit der Hintergrundfarbe drumherum übermalen.
  function eraseText(canvas, paras) {
    const c = document.createElement("canvas");
    c.width = canvas.width; c.height = canvas.height;
    const ctx = c.getContext("2d");
    ctx.drawImage(canvas, 0, 0);
    const W = c.width, H = c.height;
    const px = canvas.getContext("2d").getImageData(0, 0, W, H).data;
    const med = (a) => { a.sort((x, y) => x - y); return a[a.length >> 1]; };
    // Zeilenenden: Tinte, die direkt an eine erkannte Zeile anschließt (unsicher erkannte Wortendung,
    // Komma), gehört mit zum Text und wird mit übermalt.
    const lum = (x, y) => { const i = (y * W + x) * 4; return 0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2]; };
    function tails(l, h) {
      const out = [];
      const y0 = Math.max(0, Math.round(l.y0)), y1 = Math.min(H - 1, Math.round(l.y1));
      let bg = 0, n = 0;
      for (let y = y0; y <= y1; y += 2) for (const x of [l.x0, l.x1]) { if (x >= 0 && x < W) { bg = Math.max(bg, lum(Math.round(x), y)); n++; } }
      const inkCol = (x) => { for (let y = y0; y <= y1; y += 2) if (lum(x, y) < bg - 70) return true; return false; };
      for (const dir of [1, -1]) {
        let x = dir > 0 ? Math.round(l.x1) + 1 : Math.round(l.x0) - 1, gap = 0, last = null;
        while (x > 0 && x < W - 1 && gap < 0.6 * h && Math.abs(x - (dir > 0 ? l.x1 : l.x0)) < 2.5 * h) {
          if (inkCol(x)) { last = x; gap = 0; } else gap++;
          x += dir;
        }
        if (last != null) out.push(dir > 0 ? { x0: l.x1, y0: l.y0, x1: last, y1: l.y1 } : { x0: last, y0: l.y0, x1: l.x0, y1: l.y1 });
      }
      return out;
    }
    for (const pa of paras) {
      let spreadMax = 0, bgs = [];
      const extraBoxes = (pa.lines || []).flatMap(l => tails(l, pa.lh));
      for (const l of [...(pa.words || pa.lines), ...extraBoxes]) {
        const pad = Math.round(pa.lh * 0.28) + 3;
        const x0 = Math.max(0, l.x0 - pad), y0 = Math.max(0, l.y0 - pad);
        const x1 = Math.min(W - 1, l.x1 + pad), y1 = Math.min(H - 1, l.y1 + pad);
        // Farbe links und rechts vom Wort getrennt messen und mit einem Verlauf übermalen,
        // damit bei ungleichmäßigem Licht keine hellen/dunklen Kästen entstehen.
        const ring = (sx0, sx1) => {
          const R = [], G = [], B = [];
          const take = (x, y) => { const i = (y * W + x) * 4; R.push(px[i]); G.push(px[i + 1]); B.push(px[i + 2]); };
          for (let x = sx0; x <= sx1; x += 2) { take(x, y0); take(x, y1); }
          if (sx0 === x0) for (let y = y0; y <= y1; y += 2) take(x0, y);
          if (sx1 === x1) for (let y = y0; y <= y1; y += 2) take(x1, y);
          const m = [med(R.slice()), med(G.slice()), med(B.slice())];
          let dev = 0;
          for (let i = 0; i < R.length; i++) dev += Math.abs(R[i] - m[0]) + Math.abs(G[i] - m[1]) + Math.abs(B[i] - m[2]);
          return { m, dev: dev / R.length / 3 };
        };
        const mid = (x0 + x1) >> 1;
        const L = ring(x0, mid), Rr = ring(mid, x1);
        const m = L.m.map((v, k) => Math.round((v + Rr.m[k]) / 2));
        spreadMax = Math.max(spreadMax, Math.min(L.dev, Rr.dev));
        bgs.push(m);
        const grad = ctx.createLinearGradient(x0, 0, x1, 0);
        grad.addColorStop(0, `rgb(${L.m})`); grad.addColorStop(1, `rgb(${Rr.m})`);
        ctx.fillStyle = grad;
        ctx.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
      }
      // Unruhiger Hintergrund (Text auf einer Illustration): Textfeld bekommt eine eigene Fläche.
      const avg = [0, 1, 2].map(k => Math.round(bgs.reduce((a, b) => a + b[k], 0) / bgs.length));
      pa.busy = spreadMax > 26;
      pa.bg = `rgba(${avg[0]},${avg[1]},${avg[2]},.94)`;
      pa.rgb = avg;
    }
    growBoxes(ctx.getImageData(0, 0, W, H).data, W, H, paras);
    return c.toDataURL("image/jpeg", 0.9);
  }

  // Textfelder auf ruhigem Hintergrund in den freien Platz daneben und darunter wachsen lassen,
  // damit die neue (breitere, größere) Schrift Raum bekommt. Bilder werden dabei nicht überdeckt.
  function growBoxes(px, W, H, paras) {
    const plain = (x0, y0, x1, y1, rgb) => {
      x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0));
      x1 = Math.min(W - 1, Math.round(x1)); y1 = Math.min(H - 1, Math.round(y1));
      if (x1 <= x0 || y1 <= y0) return false;
      let n = 0, bad = 0;
      for (let y = y0; y <= y1; y += 3) for (let x = x0; x <= x1; x += 3) {
        const i = (y * W + x) * 4; n++;
        if (Math.abs(px[i] - rgb[0]) + Math.abs(px[i + 1] - rgb[1]) + Math.abs(px[i + 2] - rgb[2]) > 60) bad++;
      }
      return bad / n < 0.01;
    };
    paras.forEach((pa, i) => {
      pa.grow = { ...pa.bbox };
      if (pa.busy) return;
      const b = pa.grow, gap = pa.lh * 0.8;
      // nach rechts: höchstens bis zum gleichen Rand wie links
      const right = Math.max(b.x1, W - b.x0);
      if (right > b.x1 && plain(b.x1 + 2, b.y0, right, b.y1, pa.rgb)) b.x1 = right;
      // nach unten: schrittweise, bis Bild, nächster Text oder Seitenrand kommt
      const others = paras.filter((o, j) => j !== i && o.bbox.y0 > b.y1 && o.bbox.x0 < b.x1 && o.bbox.x1 > b.x0);
      const limit = Math.min(H - Math.max(b.x0 * 0.6, gap), ...others.map(o => o.bbox.y0 - gap));
      const step = pa.lh * 0.5;
      while (b.y1 + step <= limit && plain(b.x0, b.y1 + 2, b.x1, b.y1 + step, pa.rgb)) b.y1 += step;
    });
  }

  const ocrOpts = () => ({ bookSyllables: S.hyph === "bog" });
  // Text einer Seite aus dem OCR-Rohtext neu aufbauen (z. B. nach Änderung der Bindestrich-Einstellung).
  function retext(pg) {
    if (pg.paras && pg.paras.length) {
      pg.paras.forEach(pa => { pa.text = Layout.cleanOcr(pa.raw, ocrOpts()); });
      pg.text = pg.paras.map(pa => pa.text).join("\n\n");
    } else if (pg.rawText != null) {
      pg.text = Layout.cleanOcr(pg.rawText, ocrOpts());
    }
  }
  const toCanvas = (src) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext("2d").drawImage(img, 0, 0); res(c); };
    img.onerror = rej; img.src = src;
  });

  // Nach dem Korrigieren: Absätze wieder den Textfeldern auf der Seite zuordnen.
  function syncParas(pg) {
    if (!pg.paras) return;
    const parts = pg.text.split(/\n\s*\n/);
    pg.paras.forEach((pa, i) => { pa.text = parts[i] || ""; });
  }

  function showStatus(html) {
    $("reader").classList.remove("pagemode");
    $("reader").innerHTML = `<div class="status">${html}</div>`;
    $("reader")._speech = null;
  }

  function render() {
    const pg = pages[cur];
    $("count").textContent = t("pageOf", { a: cur + 1, b: pages.length });
    $("prev").disabled = cur === 0; $("next").disabled = cur >= pages.length - 1;
    if (pg.img) $("origImg").src = pg.img;
    $("recropBtn").hidden = !pg.photo;
    stopSpeech();
    if (pg.status === "done") {
      renderContent(pg);
      $("text").value = pg.text;
      $("edit").hidden = false;
      $("readBtn").disabled = !pg.text;
      if (!pg.text) showStatus(t("noText"));
    } else if (pg.status === "error") {
      showStatus(t("ocrFailed") + "<br>" + (pg.error || ""));
      $("text").value = ""; $("readBtn").disabled = true;
    } else {
      const pct = Math.round((pg.progress || 0) * 100);
      showStatus(`<span>${t(pg.status === "wait" ? "waiting" : pg.stage || "recognizing")}</span><div class="bar"><i style="width:${pct}%"></i></div>`);
      $("readBtn").disabled = true;
    }
    applySettings();
    renderThumbs();
  }

  function renderThumbs() {
    const box = $("thumbs"); box.innerHTML = "";
    pages.forEach((pg, i) => {
      const b = document.createElement("button");
      b.className = i === cur ? "on" : ""; b.title = t("page") + " " + (i + 1);
      b.innerHTML = pg.img ? `<img src="${pg.img}" alt="">` : `<span class="demo">${t("example")}</span>`;
      b.onclick = () => { cur = i; render(); };
      box.append(b);
    });
    const add = document.createElement("label");
    add.className = "add"; add.title = t("addPages"); add.innerHTML = icon("plus") + `<input type="file" accept="image/*" multiple hidden>`;
    add.querySelector("input").onchange = e => addFiles(e.target.files);
    box.append(add);
  }

  $("prev").onclick = () => { if (cur > 0) { cur--; render(); } };
  $("next").onclick = () => { if (cur < pages.length - 1) { cur++; render(); } };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "Escape" && document.body.classList.contains("focus")) $("focusBtn").click();
  });

  let editT;
  $("text").oninput = e => {
    clearTimeout(editT);
    editT = setTimeout(() => { pages[cur].text = e.target.value; syncParas(pages[cur]); renderContent(pages[cur]); }, 250);
  };

  // ---------- Bilder laden ----------
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        // Große Handyfotos verkleinern: schneller und für die Erkennung völlig ausreichend.
        const max = 2200, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res({ dataUrl: c.toDataURL("image/jpeg", 0.88), canvas: c });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(t("imgError"))); };
      img.src = url;
    });
  }

  const queue = [];
  async function addFiles(files) {
    const list = [...files].filter(f => f.type.startsWith("image/"));
    if (!list.length) return;
    showApp();
    const first = pages.length;
    for (const [n, f] of list.entries()) {
      try {
        const { canvas: photo } = await loadImage(f);
        const { canvas, corners } = await cropFlow(photo, null, list.length > 1 ? t("cropOf", { a: n + 1, b: list.length }) : "");
        const pg = { photo, corners, img: canvas.toDataURL("image/jpeg", 0.88), canvas, lang: S.lang, text: "", status: "wait", progress: 0 };
        pages.push(pg); queue.push(pg);
        if (n === 0) { cur = pages.length - 1; render(); }
        runQueue();
      } catch (e) { toast(e.message); }
    }
    if (!pages.length) return;
    cur = Math.min(first, pages.length - 1);
    render();
  }

  // ---------- Seite zuschneiden ----------
  // OpenCV (ca. 13 MB) wird erst beim ersten Foto geladen und dann vom Browser zwischengespeichert.
  let cvP = null;
  function getCv() {
    if (!cvP) cvP = loadScript("opencv.js").then(async () => {
      let cv = window.cv;
      if (cv instanceof Promise) cv = await cv;
      else if (!cv.Mat) await new Promise(r => { cv.onRuntimeInitialized = r; });
      return cv;
    });
    cvP.catch(() => { cvP = null; });
    return cvP;
  }

  // Dialog: Ecken zeigen (automatischer Vorschlag oder Bildrand), verschieben lassen, entzerren.
  function cropFlow(photo, startCorners, counter) {
    return new Promise(async (resolve) => {
      const W = photo.width, H = photo.height;
      const full = [[0, 0], [W, 0], [W, H], [0, H]];
      let corners = startCorners ? startCorners.map(p => [...p]) : full.map(p => [...p]);
      const dlg = $("crop"), stage = $("cropStage"), cnv = $("cropCanvas");
      dlg.hidden = false;
      $("cropMsg").textContent = (counter ? counter + " · " : "") + t("cropLoading");
      let scale = 1, ox = 0, oy = 0;
      const handles = corners.map(() => { const h = document.createElement("div"); h.className = "h"; stage.append(h); return h; });
      function layout() {
        const sw = stage.clientWidth, sh = stage.clientHeight;
        scale = Math.min(sw / W, sh / H);
        const dw = W * scale, dh = H * scale; ox = (sw - dw) / 2; oy = (sh - dh) / 2;
        cnv.width = Math.round(dw * devicePixelRatio); cnv.height = Math.round(dh * devicePixelRatio);
        Object.assign(cnv.style, { left: ox + "px", top: oy + "px", width: dw + "px", height: dh + "px" });
        cnv.getContext("2d").drawImage(photo, 0, 0, cnv.width, cnv.height);
        draw();
      }
      function draw() {
        corners.forEach(([x, y], i) => { handles[i].style.left = ox + x * scale + "px"; handles[i].style.top = oy + y * scale + "px"; });
        $("cropPoly").setAttribute("points", corners.map(([x, y]) => `${ox + x * scale},${oy + y * scale}`).join(" "));
      }
      handles.forEach((h, i) => {
        h.onpointerdown = (e) => {
          h.setPointerCapture(e.pointerId);
          const r = stage.getBoundingClientRect();
          h.onpointermove = (ev) => {
            corners[i] = [Math.min(W, Math.max(0, (ev.clientX - r.left - ox) / scale)), Math.min(H, Math.max(0, (ev.clientY - r.top - oy) / scale))];
            draw();
          };
          h.onpointerup = () => { h.onpointermove = null; };
        };
      });
      const ro = new ResizeObserver(layout); ro.observe(stage);
      layout();

      let cv = null;
      try {
        cv = await getCv();
        if (!startCorners) {
          const found = Lib.detectPage(cv, photo);
          if (found) { corners = found; draw(); }
          $("cropMsg").textContent = (counter ? counter + " · " : "") + t(found ? "cropFound" : "cropNone");
        } else $("cropMsg").textContent = (counter ? counter + " · " : "") + t("cropNone");
      } catch (e) {
        console.error(e);
        $("cropMsg").textContent = (counter ? counter + " · " : "") + t("cropNone");
      }
      const finish = (useCorners) => {
        ro.disconnect(); handles.forEach(h => h.remove()); dlg.hidden = true;
        $("cropOk").onclick = $("cropWhole").onclick = null;
        const isFull = !useCorners || useCorners.every((p, i) => Math.hypot(p[0] - full[i][0], p[1] - full[i][1]) < 2);
        if (isFull || !cv) return resolve({ canvas: photo, corners: null });
        resolve({ canvas: Lib.warpPage(cv, photo, useCorners), corners: useCorners });
      };
      $("cropOk").onclick = () => finish(Lib.orderCorners(corners));
      $("cropWhole").onclick = () => finish(null);
    });
  }

  $("recropBtn").onclick = async () => {
    const pg = pages[cur];
    if (!pg || !pg.photo) return;
    const { canvas, corners } = await cropFlow(pg.photo, pg.corners || null, "");
    Object.assign(pg, { canvas, corners, img: canvas.toDataURL("image/jpeg", 0.88), status: "wait", progress: 0, paras: null, clean: null });
    queue.push(pg); render(); runQueue();
  };

  // ---------- Texterkennung ----------
  const workers = {}; let active = null;
  const OCR_LANG = { da: "dan", de: "deu" };
  const loadScript = (src) => new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("Datei fehlt: " + src));
    document.head.append(s);
  });
  function getWorker(lang) {
    const code = OCR_LANG[lang] || "dan";
    if (!workers[code]) {
      const p = workers[code] = loadScript(`lang/${code}.js`)
        .then(() => Uint8Array.from(atob(window.TRAINEDDATA[code]), c => c.charCodeAt(0)))
        .then(bytes => Tesseract.createWorker([{ code, data: bytes }], 1, {
        workerPath: abs("worker.min.js"),
        corePath: abs("core"),
        workerBlobURL: false,
        cacheMethod: "none",
        logger: m => {
          if (!active) return;
          const names = { "loading tesseract core": "loadingCore", "loading language traineddata": "loadingLang", "initializing api": "preparing", "recognizing text": "recognizing" };
          active.stage = names[m.status] || active.stage;
          active.progress = m.status === "recognizing text" ? m.progress : (active.progress || 0);
          if (pages[cur] === active) {
            const bar = document.querySelector(".status .bar i");
            const st = document.querySelector(".status");
            if (st && st.firstChild) st.firstChild.textContent = t(active.stage);
            if (bar) bar.style.width = Math.round(active.progress * 100) + "%";
          }
        },
      })).then(async w => { await w.setParameters({ preserve_interword_spaces: "1" }); return w; });
      p.catch(() => { delete workers[code]; });
    }
    return workers[code];
  }

  let running = false;
  async function runQueue() {
    if (running) return; running = true;
    while (queue.length) {
      const pg = queue.shift();
      active = pg; pg.status = "ocr"; pg.stage = "loadingCore";
      if (pages[cur] === pg) render();
      try {
        const w = await getWorker(pg.lang);
        // rotateAuto: schräg fotografierte Seiten gerade drehen; die Positionen beziehen sich dann
        // auf das gedrehte Bild, das wir als imageColor zurückbekommen.
        const { data } = await w.recognize(pg.canvas, { rotateAuto: true }, { text: true, blocks: true, imageColor: true });
        pg.work = data.imageColor ? await toCanvas(data.imageColor) : pg.canvas;
        pg.paras = Layout.parasFromOcr(data);
        pg.rawText = data.text || "";
        retext(pg);
        pg.clean = pg.paras.length ? eraseText(pg.work, pg.paras) : null;
        pg.status = "done";
      } catch (e) {
        console.error(e);
        pg.status = "error"; pg.error = String(e && e.message || e);
      }
      active = null;
      if (pages[cur] === pg) render(); else renderThumbs();
    }
    running = false;
  }

  // ---------- Vorlesen ----------
  const synth = window.speechSynthesis;
  const SPEECH = { da: "da-DK", de: "de-DE" };
  function pickVoice(lang) {
    if (!synth) return null;
    const vs = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(lang));
    return vs.find(v => /google|premium|enhanced|natural/i.test(v.name)) || vs[0] || null;
  }
  if (synth) synth.getVoices();

  function speak(text, onBoundary, onEnd) {
    if (!synth) { toast(t("noSpeech")); return; }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = pages[cur]?.lang || S.lang;
    u.lang = SPEECH[lang]; const voice = pickVoice(lang); if (voice) u.voice = voice;
    u.rate = 0.85;
    if (onBoundary) u.onboundary = onBoundary;
    u.onend = u.onerror = () => onEnd && onEnd();
    synth.speak(u);
  }
  function clearHighlight() { document.querySelectorAll(".w.speaking").forEach(x => x.classList.remove("speaking")); }
  function stopSpeech() { if (synth) synth.cancel(); clearHighlight(); reading = false; setReadBtn(); }

  $("reader").onclick = e => {
    if ($("settings").classList.contains("open")) { $("settings").classList.remove("open"); $("setBtn").classList.remove("on"); return; }
    const w = e.target.closest(".w"); if (!w) return;
    stopSpeech();
    w.classList.add("speaking");
    speak(w.dataset.word, null, () => w.classList.remove("speaking"));
  };

  let reading = false;
  $("readBtn").onclick = () => {
    if (reading) { stopSpeech(); return; }
    const sp = $("reader")._speech; if (!sp) return;
    const spans = [...$("reader").querySelectorAll(".w")];
    reading = true; setReadBtn();
    speak(sp.full, ev => {
      if (ev.name && ev.name !== "word") return;
      const hit = sp.wordPos.find(p => ev.charIndex >= p.start && ev.charIndex < p.end) || sp.wordPos.find(p => p.start >= ev.charIndex);
      clearHighlight();
      if (hit && spans[hit.i]) spans[hit.i].classList.add("speaking");
    }, () => { reading = false; clearHighlight(); setReadBtn(); });
  };

  const DEMO = {
    da: "Det lille pindsvin bor under et stort æbletræ.\n\n" +
        "Hver morgen snuser det til blomsterne. Så leder det efter biller og orme i haven.\n\n" +
        "I dag regner det. Pindsvinet ruller sig sammen og falder i søvn.",
    de: "Der kleine Igel wohnt unter einem großen Apfelbaum.\n\n" +
        "Jeden Morgen schnuppert er an den Blumen. Dann sucht er Käfer und Würmer im Garten.\n\n" +
        "Heute regnet es. Der Igel rollt sich zusammen und schläft ein.",
  };

  // Sprache einer Seite nachträglich ändern: Fotoseiten neu erkennen, Beispielseite austauschen.
  function relang(pg) {
    pg.lang = S.lang;
    if (pg.canvas) { pg.status = "wait"; pg.progress = 0; queue.push(pg); render(); runQueue(); }
    else { if (Object.values(DEMO).includes(pg.text)) pg.text = DEMO[pg.lang]; render(); }
  }

  // ---------- Start ----------
  function showApp() { $("start").hidden = true; $("app").hidden = false; $("dock").hidden = false; window.scrollTo(0, 0); }
  function showStart() {
    stopSpeech();
    if (document.body.classList.contains("focus")) $("focusBtn").click();
    $("app").hidden = true; $("start").hidden = false; $("dock").hidden = true; $("settings").classList.remove("open");
    $("resumeWrap").hidden = !pages.length;
    $("resumeBtn").innerHTML = icon("book") + t("resume", { n: pages.length });
    window.scrollTo(0, 0);
  }
  $("homeBtn").onclick = showStart;
  $("home").onclick = showStart;
  $("home").onkeydown = e => { if (e.key === "Enter") showStart(); };
  $("resumeBtn").onclick = () => { showApp(); render(); };

  const drop = $("drop");
  $("file").onchange = e => addFiles(e.target.files);
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
  document.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])]; if (f.length) addFiles(f); });

  $("demoBtn").onclick = () => {
    pages.push({ img: null, status: "done", lang: S.lang, text: DEMO[S.lang] });
    cur = pages.length - 1; showApp(); render();
    getWorker(S.lang); // Erkennung im Hintergrund schon vorladen
  };

  applySettings();
  applyTexts();
})();
</script>
</body>
</html>
