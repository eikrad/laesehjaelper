<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f3f5">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Læsehjælper">
<title>Læsehjælper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
@font-face { font-family: "OpenDyslexic"; font-weight: 400; src: url(data:font/woff2;base64,%%OD_400%%) format("woff2"); }
@font-face { font-family: "OpenDyslexic"; font-weight: 700; src: url(data:font/woff2;base64,%%OD_700%%) format("woff2"); }

:root {
  /* Colors */
  --sky: #f2f3f5;        /* App background, neutral light gray */
  --ink: #1d2131;        /* Text and primary buttons */
  --muted: #646a7c;
  --line: #e0e3e9;
  --surface: #ffffff;
  --blue: #2e4fd1;       /* First syllable, links */
  --red: #d9473b;        /* Second syllable */
  --mark: #fde68a;       /* Read-aloud highlighting */
  /* Syllables in reading text (configurable) */
  --s0: var(--blue);
  --s1: var(--red);
  --page-bg: #ffffff;
  --font: "Andika", sans-serif;
  --size: 32px;
  --ls: 0.04em;
  --ws: 0.25em;
  --ws-box: 0.12em;
  --lh: 1.9;
  --ui: "Atkinson Hyperlegible", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--ui);
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--sky);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 760px; margin: 0 auto; padding: 14px 18px 120px; }

/* Header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 8px; }
.brand { display: flex; align-items: center; gap: 9px; cursor: pointer; border-radius: 10px; }
.brand .name { font-size: 18px; font-weight: 700; }
.logo { width: 34px; height: 20px; }
.pill { display: inline-flex; background: #fff; border-radius: 999px; padding: 3px; box-shadow: inset 0 0 0 1.5px var(--line); }
.pill button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; color: var(--muted); }
.pill button.on { background: var(--ink); color: #fff; }

/* Start screen */
.hero { padding: 40px 0 8px; }
.hero h1 {
  font-size: clamp(44px, 12vw, 76px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700;
  margin: 0 0 26px; padding-bottom: .26em; color: var(--ink);
}
.hero h1 .s { position: relative; display: inline-block; }
.hero h1 .s0::after { border-color: var(--blue); } .hero h1 .s1::after { border-color: var(--red); }
.hero h1 .s::after {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: -.24em; height: .16em;
  border-style: solid; border-width: 0 .045em .045em; border-radius: 0 0 50% 50% / 0 0 100% 100%;
  transform-origin: center; animation: arc .5s cubic-bezier(.3,1.4,.6,1) both;
}
.hero h1 .s:nth-child(2)::after { animation-delay: .12s; }
.hero h1 .s:nth-child(3)::after { animation-delay: .24s; }
.hero h1 .s:nth-child(4)::after { animation-delay: .36s; }
@keyframes arc { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hero h1 .s::after { animation: none; } }
.hero p.lead { font-size: 19px; line-height: 1.5; max-width: 34ch; margin: 0 0 30px; color: var(--muted); }

.cta {
  display: flex; align-items: center; gap: 16px; width: 100%;
  background: var(--ink); color: #fff; border-radius: 16px; padding: 18px 20px;
  cursor: pointer; transition: background .15s;
}
.cta:hover { background: #2b3045; }
.cta.over { outline: 3px dashed var(--ink); outline-offset: 4px; }
.cta .ic { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,255,255,.1); display: grid; place-items: center; flex: none; }
.cta .ic svg { width: 26px; height: 26px; }
.cta strong { display: block; font-size: 19px; font-weight: 700; line-height: 1.25; }
.cta span.sub { display: block; font-size: 15px; opacity: .7; margin-top: 2px; }
.cta input { display: none; }

.startrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin: 18px 0 0; }
.startrow .lbl { font-size: 15px; color: var(--muted); margin-right: 8px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
/* Bookshelf */
.shelf { margin: 44px 0 0; }
.shelf h2 { font-size: 20px; margin: 0 0 14px; }
.books { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 16px; }
.book { border: 0; background: none; padding: 0; text-align: left; }
.book .cover { aspect-ratio: 3 / 4; border-radius: 10px; background: #fff center / cover no-repeat; box-shadow: 0 0 0 1px var(--line), 0 6px 16px -10px rgba(29,33,49,.4); }
.book b { display: block; margin-top: 8px; font-size: 16px; line-height: 1.3; }
.book span { display: block; font-size: 14px; color: var(--muted); }
.bookbar { display: flex; gap: 10px; align-items: center; margin: 4px 0 12px; }
.bookbar input { flex: 1; min-width: 0; font-size: 22px; font-weight: 700; border: 0; background: transparent; padding: 6px 2px; border-bottom: 1.5px solid transparent; border-radius: 0; }
.bookbar input:hover, .bookbar input:focus { border-bottom-color: var(--line); outline: none; }
.btn-ghost.small { padding: 8px 14px; font-size: 15px; white-space: nowrap; }
.editbar { display: none; margin-top: 14px; }
body.editing .editbar { display: block; }
.btn-danger { border: 1.5px solid #c9372c; color: #c9372c; background: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.btn-danger.armed { background: #c9372c; color: #fff; }
.thumb { position: relative; flex: 0 0 auto; }
.thumb .ctl { display: none; position: absolute; left: 0; right: 0; bottom: -2px; justify-content: space-between; }
body.editing .thumb .ctl { display: flex; }
.thumb .ctl button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 13px; line-height: 24px; padding: 0; box-shadow: none; }
.thumb .ctl .x { background: #c9372c; }
body.editing .thumbs { padding-bottom: 14px; gap: 20px; }
.thumb .ctl { left: -8px; right: -8px; }
.btn-ghost { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); border-radius: 12px; padding: 11px 18px; font-weight: 700; }

.how { list-style: none; counter-reset: s; margin: 48px 0 0; padding: 22px 0 0; display: grid; gap: 16px; border-top: 1px solid var(--line); }
.how li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: baseline; }
.how li::before { content: counter(s); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.how b { display: block; font-size: 17px; }
.how span { color: var(--muted); font-size: 16px; }

.foot { color: var(--muted); font-size: 14px; margin: 48px 0 0; max-width: 60ch; }
.foot p { margin: 0 0 10px; }
.disclaimer summary { cursor: pointer; font-weight: 700; color: var(--ink); }
.disclaimer p { margin-top: 8px; line-height: 1.55; }

/* Reader view */
.pagecard { background: var(--page-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.orig { display: flex; justify-content: center; background: #e9ebef; padding: 14px; }
.orig img { max-width: 100%; max-height: 280px; border-radius: 12px; display: block; }
.orig.hidden { display: none; }

.reader {
  background: var(--page-bg);
  font-family: var(--font);
  font-size: var(--size);
  letter-spacing: var(--ls);
  word-spacing: var(--ws);
  line-height: var(--lh);
  padding: 30px 26px 36px;
  min-height: 240px;
  color: #1d1d1f;
}
.reader p { margin: 0 0 0.8em; max-width: 30em; }
.reader p:last-child { margin-bottom: 0; }
.reader p.short { margin-bottom: 1.2em; }
.w { white-space: nowrap; cursor: pointer; border-radius: 8px; transition: background .12s; padding: 0 .02em; }
.w.b { font-weight: 700; }
.w:hover { background: rgba(47,63,224,.08); }
.w.speaking { background: var(--mark); }
.w .s.speaking { background: var(--mark); border-radius: 6px; }
.mode-farbe .s0 { color: var(--s0); }
.mode-farbe .s1 { color: var(--s1); }
.mode-boegen .w .s { position: relative; display: inline-block; padding-bottom: .12em; }
.mode-boegen .w .s::after {
  content: ""; position: absolute; left: 6%; right: 6%; bottom: -.02em; height: .28em;
  border: .07em solid #555; border-top: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
.mode-boegen .w .s.tiny::after { left: -10%; right: -10%; }
.mode-boegen.mode-farbe .w .s0::after { border-color: var(--s0); }
.mode-morf .w .s0 { color: var(--s0); }
.mode-morf .w .s1 { color: var(--s1); }
.mode-morf .w .s.suf { color: #7c8190; }
.mode-boegen.mode-farbe .w .s1::after { border-color: var(--s1); }

.reader.pagemode { padding: 0; min-height: 0; }
.reader.comparing { padding: 0; min-height: 0; }
.reader .origfull { display: block; width: 100%; }
.pageview { position: relative; line-height: 0; }
.pageview > img { width: 100%; display: block; }
.tbox { position: absolute; overflow: hidden; line-height: min(var(--lh), 1.6); word-spacing: var(--ws-box); }
.tbox p { margin: 0 0 .35em; max-width: none; }
.tbox p:last-child { margin-bottom: 0; }
.tbox.busy { border-radius: 12px; padding: 0 .3em; }
.status { padding: 48px 20px; text-align: center; color: var(--muted); font-family: var(--ui); font-size: 17px; }
.bar { height: 10px; background: var(--sky); border-radius: 99px; overflow: hidden; max-width: 280px; margin: 14px auto 0; }
.bar i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .2s; }

.edit { border-top: 1.5px solid var(--line); padding: 14px 22px 18px; font-family: var(--ui); background: #fff; }
.edit summary { cursor: pointer; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 10px; list-style: none; }
.edit summary::-webkit-details-marker { display: none; }
.edit textarea { width: 100%; min-height: 150px; margin-top: 12px; padding: 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--sky); font-size: 17px; line-height: 1.5; resize: vertical; }
.edit .hint { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

.thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 16px 2px 4px; }
.thumbs button { flex: 0 0 auto; border: 0; border-radius: 12px; padding: 0; background: none; box-shadow: 0 0 0 2px transparent; }
.thumbs button.on { box-shadow: 0 0 0 3px var(--blue); }
.thumbs img, .thumbs .demo { width: 56px; height: 74px; object-fit: cover; border-radius: 12px; display: grid; place-items: center; }
.thumbs .demo { background: #fff; font-size: 12px; color: var(--muted); }
.thumbs .add { width: 56px; height: 74px; border-radius: 12px; border: 2px dashed #b7bde6; display: grid; place-items: center; color: var(--muted); cursor: pointer; flex: none; }

/* Bottom toolbar */
.dock {
  position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
  background: var(--ink); color: #fff; box-shadow: 0 14px 34px -10px rgba(23,25,59,.6);
  max-width: calc(100vw - 20px);
}
.dock button { border: 0; background: none; color: inherit; height: 46px; min-width: 46px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; font-weight: 700; }
.dock button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.dock button:disabled { opacity: .35; cursor: default; }
.dock button.on { background: rgba(255,255,255,.18); }
.dock .read { background: #fff; color: var(--ink); padding: 0 18px; }
.dock .read:hover:not(:disabled) { background: #e9ebf0; }
.dock .count { font-weight: 700; font-size: 15px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.dock .sep { width: 1px; height: 24px; background: rgba(255,255,255,.2); margin: 0 2px; }
@media (max-width: 440px) { .dock .read span, .dock .hide-sm { display: none; } .dock .read { padding: 0 14px; } .dock .count { min-width: 50px; } }

/* Settings sheet above the toolbar */
.settings {
  position: fixed; left: 50%; transform: translate(-50%, 16px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 70px); z-index: 19;
  width: min(560px, calc(100vw - 20px)); max-height: 66vh; overflow-y: auto;
  background: #fff; border-radius: 18px; padding: 20px 20px 22px;
  box-shadow: 0 24px 60px -18px rgba(23,25,59,.45);
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
}
.settings.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .settings { transition: none; } }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; }
.grid .wide { grid-column: 1 / -1; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
.field > label, .field > .flabel { display: block; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.field select { width: 100%; padding: 11px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--sky); }
input[type=range] { width: 100%; accent-color: var(--blue); }
.seg { display: flex; background: var(--sky); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 11px; padding: 9px 6px; font-weight: 700; font-size: 15px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(23,25,59,.18); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 38px; height: 38px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1.5px var(--line); }
.swatches button.on { box-shadow: inset 0 0 0 1.5px var(--line), 0 0 0 3px #fff, 0 0 0 5.5px var(--ink); }

/* Cropping */
.crop { position: fixed; left: 0; right: 0; top: 0; z-index: 40; background: #14171f; color: #fff; display: flex; flex-direction: column; }
.crop-head { padding: max(14px, env(safe-area-inset-top)) 18px 10px; }
.crop-head strong { display: block; font-size: 18px; }
.crop-head span { display: block; font-size: 15px; opacity: .75; margin-top: 2px; }
.crop-stage { position: relative; flex: 1; margin: 6px 14px; touch-action: none; }
.crop-stage canvas { position: absolute; display: block; }
.crop-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.crop-stage path { fill: rgba(46,79,209,.12); stroke: #fff; stroke-width: 2; }
.crop-stage .h { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; touch-action: none; cursor: grab; }
.crop-stage .h::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--blue); }
.crop-stage .h.mid::after { inset: 15px; background: var(--blue); box-shadow: 0 0 0 3px #fff; }
.crop-foot { display: flex; justify-content: space-between; gap: 12px; padding: 12px 18px max(16px, env(safe-area-inset-bottom)); }
.crop-foot .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.cta-sm { border: 0; background: #fff; color: var(--ink); border-radius: 12px; padding: 11px 22px; font-weight: 700; }
.editactions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.installrow { margin: 18px 0 0; }
.importrow { margin: 10px 0 0; }
.importrow .linkbtn { cursor: pointer; }
#exportBtn { gap: 6px; display: inline-flex; align-items: center; }
#exportBtn svg { width: 18px; height: 18px; }
@media (max-width: 520px) { #exportBtn span { display: none; } }
.profrow { display: flex; gap: 8px; margin-top: 8px; }
.profrow select, .profrow input { flex: 1; min-width: 0; }
.profrow input { border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; background: #fff; }
.btn-danger.small { padding: 8px 14px; font-size: 15px; white-space: nowrap; }
.btn-danger[hidden] { display: none; }
.fhint { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.own { display: inline-flex; gap: 8px; margin-left: 6px; padding-left: 14px; border-left: 1.5px solid var(--line); }
.pick { display: inline-flex; align-items: center; gap: 6px; background: var(--sky); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
.pick input { width: 30px; height: 30px; border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; }
.pick input::-webkit-color-swatch-wrapper { padding: 0; }
.pick input::-webkit-color-swatch { border: 0; border-radius: 50%; }
.pick input::-moz-color-swatch { border: 0; border-radius: 50%; }
@media (max-width: 480px) { .own { margin-left: 0; padding-left: 0; border-left: 0; } }

/* Focus mode: text only */
body.focus header.top, body.focus .orig, body.focus .edit, body.focus .thumbs, body.focus .settings, body.focus .foot, body.focus .dock > :not(.keep) { display: none !important; }
body.focus .wrap { max-width: none; padding: 0; }
body.focus .pagecard { border-radius: 0; box-shadow: none; min-height: 100vh; }
body.focus .reader { padding: 48px 7vw 120px; min-height: 100vh; }

.yourturn { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 20px; background: var(--mark); color: var(--ink); font-weight: 700; font-size: 17px; }
.yourturn[hidden] { display: none; }
.together { padding: 14px 20px 18px; border-top: 1px solid var(--line); background: #f7f8fa; font-family: var(--ui); }
.together[hidden], .profrow[hidden] { display: none; }
.togetherhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.together ul { margin: 8px 0 0; padding-left: 1.2em; line-height: 1.5; font-size: 17px; }
body.focus .together { display: none !important; }
.reader.moving .tbox { outline: 2px dashed var(--blue); outline-offset: -1px; cursor: move; touch-action: none; user-select: none; }
.reader.moving .tbox.dragging { z-index: 2; outline-style: solid; background: rgba(46,79,209,.08); }
.reader.moving .w { cursor: move; }
.grip { position: absolute; right: 3px; bottom: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px #fff; cursor: nwse-resize; touch-action: none; z-index: 3; }
#moveBtn.on { background: var(--ink); color: #fff; }
.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 30; }
.toast.show { opacity: 1; }
[hidden] { display: none !important; }
</style>
</head>

  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
  <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6zM12 6v14.5"/></symbol>
</svg>
<div class="wrap">
  <header class="top">
    <div class="brand" id="home" role="button" tabindex="0">
      <svg class="logo" viewBox="0 0 34 20" aria-hidden="true"><path d="M3 5a7 7 0 0 0 14 0" stroke="#2e4fd1" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M17 5a7 7 0 0 0 14 0" stroke="#d9473b" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>
      <span class="name" data-t="docTitle"></span>
    </div>
    <div class="pill" id="uiLang" aria-label="Sprog / Sprache">
      <button data-v="da">DA</button>
      <button data-v="de">DE</button>
      <button data-v="en">EN</button>
    </div>
  </header>

  <!-- Start screen -->
  <section id="start">
    <div class="hero">
      <h1 id="heroWord"></h1>
      <p class="lead" data-t="startIntro"></p>
      <label class="cta" id="drop">
        <input type="file" id="file" accept="image/*" multiple>
        <span class="ic"><svg class="i"><use href="#i-camera"/></svg></span>
        <span><strong data-t="dropMain"></strong><span class="sub" data-t="dropSub"></span></span>
      </label>
      <div class="startrow">
        <div id="langStart"><span class="lbl" data-t="bookLangColon"></span>
          <div class="pill">
            <button data-v="da" data-t="langDa"></button>
            <button data-v="de" data-t="langDe"></button>
            <button data-v="en" data-t="langEn"></button>
          </div>
        </div>
        <button class="linkbtn" id="demoBtn" data-t="demo"></button>
      </div>
      <p class="importrow"><label class="linkbtn"><input type="file" id="importFile" accept=".epub,application/epub+zip" hidden><span data-t="importBook"></span></label></p>
      <p class="installrow" id="installRow" hidden><button class="btn-ghost" id="installBtn"><svg class="i"><use href="#i-plus"/></svg><span data-t="install"></span></button></p>
    </div>
    <section class="shelf" id="shelf" hidden>
      <h2 data-t="shelfTitle"></h2>
      <div class="books" id="books"></div>
    </section>
    <ol class="how">
      <li><div><b data-t="how1t"></b><span data-t="how1"></span></div></li>
      <li><div><b data-t="how2t"></b><span data-t="how2"></span></div></li>
      <li><div><b data-t="how3t"></b><span data-t="how3"></span></div></li>
    </ol>
    <div class="foot">
      <p data-t="foot"></p>
      <details class="disclaimer"><summary data-t="aboutTitle"></summary><p data-th="aboutText"></p></details>
    </div>
  </section>

  <!-- Reader view -->
  <section id="app" hidden>
    <div class="bookbar">
      <input id="bookTitle" autocomplete="off" data-tp="titlePh">
      <button class="btn-ghost small" id="exportBtn"><svg class="i"><use href="#i-download"/></svg><span data-t="exportBook"></span></button>
      <button class="btn-ghost small" id="editPagesBtn" data-t="editPages"></button>
    </div>
    <article class="pagecard">
      <div class="orig" id="orig"><img id="origImg" alt=""></div>
      <div class="reader" id="reader"></div>
      <div class="yourturn" id="yourTurn" hidden><span data-t="yourTurn"></span><button class="btn-ghost small" id="againBtn"><svg class="i"><use href="#i-speak"/></svg><span data-t="again"></span></button></div>
      <div class="together" id="together" hidden>
        <div class="togetherhead"><strong data-t="togetherTitle"></strong><button class="linkbtn" id="ownQBtn" data-t="ownQ"></button></div>
        <ul id="togetherQs"></ul>
        <div class="profrow" id="ownQRow" hidden><input id="ownQ" autocomplete="off" data-tp="ownQPh"><button class="btn-ghost small" id="ownQSave" data-t="save"></button></div>
      </div>
      <details class="edit" id="edit">
        <summary><svg class="i"><use href="#i-pencil"/></svg><span data-t="editSummary"></span></summary>
        <textarea id="text" spellcheck="true"></textarea>
        <p class="hint" data-th="editHint"></p>
        <div class="editactions">
          <button class="btn-ghost" id="recropBtn"><svg class="i"><use href="#i-crop"/></svg><span data-t="cropAgain"></span></button>
          <button class="btn-ghost" id="reocrBtn"><svg class="i"><use href="#i-redo"/></svg><span data-t="ocrAgain"></span></button>
          <button class="btn-ghost" id="moveBtn"><svg class="i"><use href="#i-crop"/></svg><span data-t="moveBoxes"></span></button>
          <button class="btn-ghost" id="resetPlaceBtn"><svg class="i"><use href="#i-redo"/></svg><span data-t="resetPlace"></span></button>
        </div>
      </details>
    </article>
    <div class="thumbs" id="thumbs"></div>
    <div class="editbar" id="editbar"><button class="btn-danger" id="delBookBtn" data-t="deleteBook"></button></div>
  </section>
</div>

<nav class="dock" id="dock" hidden>
  <button id="homeBtn" data-ta="toStart"><svg class="i"><use href="#i-home"/></svg></button>
  <span class="sep hide-sm"></span>
  <button id="prev" data-ta="prevPage"><svg class="i"><use href="#i-prev"/></svg></button>
  <span class="count" id="count"></span>
  <button id="next" data-ta="nextPage"><svg class="i"><use href="#i-next"/></svg></button>
  <button class="read keep" id="readBtn"></button>
  <button id="compareBtn"><svg class="i"><use href="#i-eye"/></svg></button>
  <button id="setBtn" data-ta="adjust"><svg class="i"><use href="#i-aa"/></svg></button>
  <button class="keep" id="focusBtn"></button>
</nav>

<div class="settings" id="settings">
  <div class="grid">
    <div class="field wide">
      <label for="profileSel" data-t="reader"></label>
      <div class="profrow"><select id="profileSel"></select><button class="btn-danger small" id="profileDel"></button></div>
      <div class="profrow"><input id="profileName" autocomplete="off" data-tp="newReaderPh"><button class="btn-ghost small" id="profileAdd" data-t="addReader"></button></div>
      <p class="fhint" data-t="readerHint"></p>
    </div>
    <div class="field wide">
      <span class="flabel" data-t="view"></span>
      <div class="seg" id="viewSet">
        <button data-v="side" data-t="viewPage"></button>
        <button data-v="tekst" data-t="viewText"></button>
      </div>
    </div>
    <div class="field wide">
      <span class="flabel" data-t="syllables"></span>
      <div class="seg" id="mode">
        <button data-v="aus" data-t="off"></button>
        <button data-v="farbe" data-t="color"></button>
        <button data-v="boegen" data-t="arcs"></button>
        <button data-v="beides" data-t="both"></button>
        <button data-v="morf" data-t="morf"></button>
      </div>
      <p class="fhint" data-t="sylHint"></p>
    </div>
    <div class="field wide">
      <label for="font" data-t="font"></label>
      <select id="font">
        <option value='"Andika", sans-serif' data-t="andika"></option>
        <option value='"OpenDyslexic", sans-serif'>OpenDyslexic</option>
        <option value='"Atkinson Hyperlegible", sans-serif'>Atkinson Hyperlegible</option>
        <option value='"Lexend", sans-serif'>Lexend</option>
        <option value='Verdana, "DejaVu Sans", sans-serif'>Verdana</option>
      </select>
    </div>
    <div class="field wide">
      <label for="size" data-t="size"></label>
      <input type="range" id="size" min="18" max="64" step="1">
    </div>
    <div class="field">
      <label for="ls" data-t="letterSp"></label>
      <input type="range" id="ls" min="0" max="0.25" step="0.01">
    </div>
    <div class="field">
      <label for="lh" data-t="lineSp"></label>
      <input type="range" id="lh" min="1.3" max="3" step="0.1">
    </div>
    <div class="field wide">
      <span class="flabel" data-t="linesLabel"></span>
      <div class="seg" id="linesSet">
        <button data-v="normal" data-t="linesNormal"></button>
        <button data-v="kort" data-t="linesShort"></button>
      </div>
    <div class="field wide">
      <span class="flabel" data-t="togetherLabel"></span>
      <div class="seg" id="togetherSet">
        <button data-v="an" data-t="togetherOn"></button>
        <button data-v="aus" data-t="togetherOff"></button>
      </div>
      <p class="fhint" data-t="togetherHint"></p>
    </div>
      <p class="fhint" data-t="linesHint"></p>
    </div>
    <div class="field wide">
      <span class="flabel" data-t="sylColors"></span>
      <div class="swatches" id="colors">
        <button data-v="#2f3fe0,#e5412d" style="background:linear-gradient(90deg,#2f3fe0 50%,#e5412d 50%)" data-ta="cBlueRed"></button>
        <button data-v="#2f3fe0,#17193b" style="background:linear-gradient(90deg,#2f3fe0 50%,#17193b 50%)" data-ta="cBlueBlack"></button>
        <button data-v="#e5412d,#17193b" style="background:linear-gradient(90deg,#e5412d 50%,#17193b 50%)" data-ta="cRedBlack"></button>
        <button data-v="#7a3fc2,#16804a" style="background:linear-gradient(90deg,#7a3fc2 50%,#16804a 50%)" data-ta="cPurpleGreen"></button>
        <span class="own">
          <label class="pick"><input type="color" id="c0"><span data-t="syl1"></span></label>
          <label class="pick"><input type="color" id="c1"><span data-t="syl2"></span></label>
        </span>
      </div>
    </div>
    <div class="field">
      <span class="flabel" data-t="background"></span>
      <div class="swatches" id="bg">
        <button data-v="#ffffff" style="background:#fff" data-ta="bWhite"></button>
        <button data-v="#fff8e6" style="background:#fff8e6" data-ta="bCream"></button>
        <button data-v="#fdf0b8" style="background:#fdf0b8" data-ta="bYellow"></button>
        <button data-v="#e6ecff" style="background:#e6ecff" data-ta="bBlue"></button>
        <button data-v="#e4f5e3" style="background:#e4f5e3" data-ta="bGreen"></button>
      </div>
    </div>
    <div class="field">
      <span class="flabel" data-t="bookLang"></span>
      <div class="seg" id="langSet">
        <button data-v="da" data-t="langDa"></button>
        <button data-v="de" data-t="langDe"></button>
        <button data-v="en" data-t="langEn"></button>
      </div>
    </div>
    <div class="field wide">
      <span class="flabel" data-t="hyph"></span>
      <div class="seg" id="hyphSet">
        <button data-v="normal" data-t="hyphNormal"></button>
        <button data-v="bog" data-t="hyphBook"></button>
      </div>
      <p class="fhint" data-t="hyphHint"></p>
    </div>
    <div class="field">
      <span class="flabel" data-t="original"></span>
      <div class="seg" id="origToggle">
        <button data-v="an" data-t="show"></button>
        <button data-v="aus" data-t="hide"></button>
      </div>
    </div>
    <div class="field">
      <span class="flabel" data-t="rateLabel"></span>
      <div class="seg" id="rateSet">
        <button data-v="langsom" data-t="rateSlow"></button>
        <button data-v="normal" data-t="rateNormal"></button>
      </div>
    </div>
    <div class="field">
      <span class="flabel" data-t="turnLabel"></span>
      <div class="seg" id="turnSet">
        <button data-v="an" data-t="turnOn"></button>
        <button data-v="aus" data-t="turnOff"></button>
      </div>
    </div>
    <div class="field wide">
      <details class="disclaimer" id="evidence"><summary data-t="evTitle"></summary><p data-th="evText"></p></details>
    </div>
  </div>
</div>
<div class="crop" id="crop" hidden>
  <div class="crop-head">
    <div><strong data-t="cropTitle"></strong><span id="cropMsg"></span></div>
  </div>
  <div class="crop-stage" id="cropStage">
    <canvas id="cropCanvas"></canvas>
    <svg id="cropSvg"><path id="cropPoly"/></svg>
  </div>
  <div class="crop-foot">
    <button class="btn-ghost" id="cropWhole" data-t="cropWhole"></button>
    <button class="cta-sm" id="cropOk" data-t="cropUse"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="tesseract.min.js"></script>
<script>%%APP_JS%%</script>
</body>
</html>
