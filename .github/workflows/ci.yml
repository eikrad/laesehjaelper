name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # die CI pusht nie, also keine Zugangsdaten im Arbeitsverzeichnis
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26   # aktuelle LTS (seit 28. 10. 2026)
          cache: npm
      - run: npm ci
      - name: Bekannte Sicherheitslücken in Abhängigkeiten
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Typ-Check
        run: npm run typecheck
      - name: Unit-Tests (mit Abdeckung)
        run: npm run coverage:unit
      - name: Browser für End-to-End-Tests
        run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests (mit Abdeckung)
        run: npm run coverage:e2e
      - name: Testabdeckung prüfen
        run: node coverage.ts
      - name: Abdeckungsbericht
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/merged/
          retention-days: 14
      - name: Build (für die Seite, minifiziert)
        run: npm run build
      - name: Testbericht
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Seite für GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
