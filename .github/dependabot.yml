# Abhängigkeiten aktuell halten: Dependabot öffnet wöchentlich Pull Requests (gesammelt),
# Sicherheitsupdates sofort. Gemergt wird wie immer nur nach grüner CI und durch den Maintainer.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
